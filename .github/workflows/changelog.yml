name: PR Changelogs
concurrency: commit_action
on:
  pull_request_target:
    types: [closed]

env:
  GITHUB_TOKEN: ${{ secrets.FORGE_TOKEN }}
  CHANGELOG_DIR: Resources/Changelog/NuclearForge.yml
  PR_NUMBER: ${{ github.event.number }}

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    steps:
    - name: Checkout Master
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.FORGE_TOKEN }}
        ref: master

    - name: Setup Git
      run: |
        git config --global user.name "Forge-Changelog"
        git config --global user.email "changelog@users.noreply.github.com"
      shell: bash

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 18.x

    - name: Install Dependencies
      run: |
        cd "Tools/changelogs"
        npm install
      shell: bash

    - name: Generate Changelog
      run: |
        cd "Tools/changelogs"
        node changelog.js
      shell: bash

    - name: Commit Changelog
      run: |
        git pull origin master
        git add "${{ env.CHANGELOG_DIR }}"
        git commit -m "Automated Changelog (#${{ env.PR_NUMBER }}) [skip ci]"
        git push origin master
      shell: bash
      continue-on-error: true
