name: Publish
concurrency:
  group: publish


on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SECRETS_TOKEN: ${{ secrets.SECRETS_TOKEN }}

    steps:
    - uses: actions/checkout@v3.6.0
      with:
        submodules: 'recursive'

# Forge-Secrets-Start
    - name: Checkout secrets
      if: ${{ env.SECRETS_TOKEN != '' }}
      uses: actions/checkout@v4
      with:
        repository: Forge-Station/FalloutSecrets
        path: FalloutSecrets
        token: ${{ env.SECRETS_TOKEN }}
        persist-credentials: false

    - name: Verify secrets
      if: ${{ env.SECRETS_TOKEN != '' }}
      run: test -f FalloutSecrets/Content.Secrets.Server/Content.Secrets.Server.csproj

    - name: Merge secret resources
      if: ${{ env.SECRETS_TOKEN != '' }}
      shell: bash
      run: |
        src=FalloutSecrets/Resources
        if [ ! -d "$src" ]; then
          echo "No $src, skipping"
          exit 0
        fi
        conflicts=$(cd "$src" && find . -type f ! -name .gitkeep -print | while read -r f; do
          [ -e "../../Resources/$f" ] && echo "$f"
        done || true)
        if [ -n "$conflicts" ]; then
          echo "::error::Secret resources overwrite public files:"
          echo "$conflicts"
          exit 1
        fi
        tar -C "$src" --exclude=.gitkeep -cf - . | tar -C Resources -xf -
        echo "Merged $(find "$src" -type f ! -name .gitkeep | wc -l) secret resource files"
# Forge-Secrets-End

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform win-x64 --platform linux-x64 --platform osx-x64 --platform linux-arm64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Route CDN publish through direct IP
      run: echo "${{ secrets.CDN_DIRECT_IP }} cdn.corvaxforge.ru" | sudo tee -a /etc/hosts > /dev/null

    - name: Publish version
      run: Tools/publish_multi_request.py
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}

    #- name: Publish changelog (RSS)
    #  run: Tools/actions_changelog_rss.py
    #  env:
    #    CHANGELOG_RSS_KEY: ${{ secrets.CHANGELOG_RSS_KEY }}
