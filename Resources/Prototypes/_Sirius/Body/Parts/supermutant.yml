- type: entity
  id: N14PartSupermutant
  parent: [BaseItem, BasePart]
  name: "Supermutant body part"
  abstract: true
  components:
  - type: Damageable
    damageContainer: Biological
  - type: BodyPart
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice
    price: 0 # Corvax-Change
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: N14TorsoSupermutant
  name: "Supermutant torso"
  parent: [N14PartSupermutant, BaseTorso]
  components:
  - type: Sprite
    sprite: _Sirius/Mobs/Species/Supermutant/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20
  - type: StaticPrice
    price: 15
  - type: Item
    size: Large

- type: entity
  id: N14HeadSupermutant
  name: "Supermutant head"
  parent: [N14PartSupermutant, BaseHead]
  components:
  - type: Sprite
    sprite: _Sirius/Mobs/Species/Supermutant/parts.rsi
    state: "head_m"
  - type: Icon
    sprite: _Sirius/Mobs/Species/Supermutant/parts.rsi
    state: "head_m"
  - type: BodyPart
    partType: Head
    vital: true
  - type: Input
    context: "ghost"
  - type: MovementSpeedModifier
    baseWalkSpeed: 0
    baseSprintSpeed: 0
  - type: InputMover
  - type: GhostOnMove
  - type: Tag
    tags:
      - Head
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: Blood
        Quantity: 10
  - type: StaticPrice
    price: 15
  - type: Item
    size: Normal

