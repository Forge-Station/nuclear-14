- type: species
  id: Supermutant
  name: species-name-Supermutant
  roundStart: false
  prototype: N14MobSupermutant
  sprites: N14MobSupermutantSprites
  markingLimits: MobSupermutantMarkingLimits
  dollPrototype: N14MobSupermutantDummy
  skinColoration: HumanToned
  minHeight: 0.937 # Corvax-Change
  maxHeight: 1.249 # Corvax-Change
  minWidth: 0.825 # Corvax-Change
  maxWidth: 1.05 # Corvax-Change
  minAge: 200 # Corvax-Change
  oldAge: 250 # Corvax-Change
  maxAge: 300 # Corvax-Change
# The lack of a layer means that
# this person cannot have round-start anything
# applied to that layer. It has to instead
# be defined as a 'custom base layer'
# in either the mob's starting marking prototype,
# or it has to be added in C#.
- type: speciesBaseSprites
  id: N14MobSupermutantSprites
  sprites:
    Head: N14MobSupermutantHead
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Chest: N14MobSupermutantTorso
    Eyes: MobHumanoidEyes
    LArm: N14MobSupermutantLArm
    RArm: N14MobSupermutantRArm
    LHand: N14MobSupermutantLHand
    RHand: N14MobSupermutantRHand
    LLeg: N14MobSupermutantLLeg
    RLeg: N14MobSupermutantRLeg
    LFoot: N14MobSupermutantLFoot
    RFoot: N14MobSupermutantRFoot

- type: markingPoints
  id: MobSupermutantMarkingLimits
  onlyWhitelisted: true # Forge-Change ещё удалил ненужные слоты
  points:
    Snout:
      points: 1
      required: false
    Chest:
      points: 1
      required: false
    RightLeg:
      points: 2
      required: false
    RightFoot:
      points: 2
      required: false
    LeftLeg:
      points: 2
      required: false
    LeftFoot:
      points: 2
      required: false
    RightArm:
      points: 2
      required: false
    RightHand:
      points: 2
      required: false
    LeftArm:
      points: 2
      required: false
    LeftHand:
      points: 2
      required: false

