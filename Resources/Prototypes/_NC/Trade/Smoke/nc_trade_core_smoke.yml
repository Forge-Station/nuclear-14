# NC Trade Core Smoke Pack
#
# Dev-only prototype set for manual Trade / NcStore verification.
# Nothing references NcTradeSmokeProfile by default. Attach this profile to a test vendor/store
# when you want to exercise buy, sell, barter and Supply V2 after Patch 5.3 Stage 1.
#
# Required baseline ids in the content pack this was written for:
# - Caps
# - FoodSnackChips
# - N14KitchenKnife
# - N14IngotCopper1
# Optional manual stack test item:
# - N14IngotCopper30, or any larger copper stack variant sharing StackTypeId with N14IngotCopper1.

# -----------------------------------------------------------------------------
# Store profile
# -----------------------------------------------------------------------------

- type: ncStoreProfile
  id: NcTradeSmokeProfile
  buy:
  - NcTradeSmokeBuyPreset
  sell:
  - NcTradeSmokeSellPreset
  barter:
  - NcTradeSmokeBarterPreset
  contracts: NcTradeSmokeContractsPreset

# -----------------------------------------------------------------------------
# Buy / Sell
# -----------------------------------------------------------------------------

- type: storePresetStructured
  id: NcTradeSmokeBuyPreset
  currency: Caps
  categories:
  - NcTradeSmokeBuyCategory

- type: storeCategoryStructured
  id: NcTradeSmokeBuyCategory
  name: "Покупка"
  entries:
  - proto: FoodSnackChips
    price: 1
    amount: 1
  - proto: N14KitchenKnife
    price: 6
    amount: 1

- type: storePresetStructured
  id: NcTradeSmokeSellPreset
  currency: Caps
  categories:
  - NcTradeSmokeSellCategory

- type: storeCategoryStructured
  id: NcTradeSmokeSellCategory
  name: "Продажа"
  entries:
  - proto: FoodSnackChips
    price: 1
    amount: 1
  - proto: N14IngotCopper1
    price: 2
    amount: 1

# -----------------------------------------------------------------------------
# Item groups used by Barter and Supply V2
# -----------------------------------------------------------------------------

- type: ncItemGroup
  id: NcTradeSmokeGroupSnacks
  name: "Снеки"
  icon: FoodSnackChips
  prototypes:
  - FoodSnackChips

- type: ncItemGroup
  id: NcTradeSmokeGroupKnives
  name: "Ножи"
  icon: N14KitchenKnife
  prototypes:
  - N14KitchenKnife

# This group intentionally contains only the x1 prototype.
# Larger copper stack variants should still match through StackTypeId after Patch 5.2.
- type: ncItemGroup
  id: NcTradeSmokeGroupCopperStacks
  name: "Медные слитки"
  icon: N14IngotCopper1
  prototypes:
  - N14IngotCopper1

# -----------------------------------------------------------------------------
# Retrieval V2 Stage 2 spawn markers
# -----------------------------------------------------------------------------

# Place this marker entity on the test map to verify Retrieval V2 Stage 2 marker spawn.
# The contract still accepts any matching item; tracked-item identity is a later stage.
- type: entity
  id: NcTradeSmokeRetrievalSpawnMarker
  parent: MarkerBase
  name: контрактная точка появления груза
  suffix: NC, Smoke
  components:
  - type: Sprite
    layers:
    - state: blue
  - type: NcContractSpawnPoint
    id: NcTradeSmokeRetrievalMarker
    groups:
    - NcTradeSmokeRetrieval

- type: entity
  id: NcTradeSmokeVendorPickupMarker
  parent: MarkerBase
  name: контрактная точка выдачи у торговца
  suffix: NC, Smoke, Pickup
  components:
  - type: Sprite
    layers:
    - state: blue
  - type: NcContractSpawnPoint
    id: NcTradeSmokeVendorPickupMarker
    groups:
    - NcTradeSmokeVendorPickup

- type: entity
  id: NcTradeSmokeClinicDropoffMarker
  parent: MarkerBase
  name: контрактная точка доставки в медпункт
  suffix: NC, Smoke, Dropoff
  components:
  - type: Sprite
    layers:
    - state: green
  - type: NcContractSpawnPoint
    id: NcTradeSmokeClinicDropoffMarker
    groups:
    - NcTradeSmokeClinicDropoff

- type: entity
  id: NcTradeSmokeOutpostDropoffMarker
  parent: MarkerBase
  name: контрактная точка доставки на аванпост
  suffix: NC, Smoke, Dropoff
  components:
  - type: Sprite
    layers:
    - state: red
  - type: NcContractSpawnPoint
    id: NcTradeSmokeOutpostDropoffMarker
    groups:
    - NcTradeSmokeOutpostDropoff

- type: entity
  id: NcTradeSmokeHuntSpawnMarker
  parent: MarkerBase
  name: контрактная точка появления целей охоты
  suffix: NC, Smoke, Hunt
  components:
  - type: Sprite
    layers:
    - state: green
  - type: NcContractSpawnPoint
    id: NcTradeSmokeHuntSpawn
    groups:
    - NcTradeSmokeHunt

# -----------------------------------------------------------------------------
# Barter V1.1
# -----------------------------------------------------------------------------

- type: ncBarterPreset
  id: NcTradeSmokeBarterPreset
  categories:
  - NcTradeSmokeBarterCategory

- type: ncBarterCategory
  id: NcTradeSmokeBarterCategory
  name: "Бартер"
  listings:
  - NcTradeSmokeBarterCapsToCaps
  - NcTradeSmokeBarterPrototypeToPrototype
  - NcTradeSmokeBarterGroupToCurrency
  - NcTradeSmokeBarterReceivePool
  - NcTradeSmokeBarterDuplicateCurrencyCost
  - NcTradeSmokeBarterGroupPrototypeOverlap

- type: ncBarterListing
  id: NcTradeSmokeBarterCapsToCaps
  name: "Обмен крышек"
  description: "Обменяйте 2 крышки на 1 крышку. Тестовый убыточный обмен для проверки списания валюты."
  icon: FoodSnackChips
  cost:
  - currency: Caps
    count: 2
  receive:
  - currency: Caps
    count: 1

- type: ncBarterListing
  id: NcTradeSmokeBarterPrototypeToPrototype
  name: "Снек на нож"
  description: "Сдайте снек и получите кухонный нож."
  icon: N14KitchenKnife
  cost:
  - prototype: FoodSnackChips
    count: 1
  receive:
  - prototype: N14KitchenKnife
    count: 1

- type: ncBarterListing
  id: NcTradeSmokeBarterGroupToCurrency
  name: "Ножи за крышки"
  description: "Сдайте любой подходящий нож и получите крышки."
  icon: N14KitchenKnife
  cost:
  - group: NcTradeSmokeGroupKnives
    count: 1
  receive:
  - currency: Caps
    count: 2

- type: ncBarterListing
  id: NcTradeSmokeBarterReceivePool
  name: "Случайная награда"
  description: "Обменяйте крышку на одну случайную награду из тестового пула."
  icon: FoodSnackChips
  cost:
  - currency: Caps
    count: 1
  receivePools:
  - pool: NcTradeSmokeBarterReceivePoolBasic
    rolls: 1

- type: ncBarterListing
  id: NcTradeSmokeBarterDuplicateCurrencyCost
  name: "Двойная цена в крышках"
  description: "Проверяет, что несколько строк цены в одной валюте суммируются правильно."
  icon: FoodSnackChips
  cost:
  - currency: Caps
    count: 1
  - currency: Caps
    count: 2
  receive:
  - prototype: FoodSnackChips
    count: 1

- type: ncBarterListing
  id: NcTradeSmokeBarterGroupPrototypeOverlap
  name: "Сложный обмен ножей"
  description: "Сдайте 4 подходящих ножа. Один и тот же предмет не должен засчитываться дважды."
  icon: N14KitchenKnife
  cost:
  - group: NcTradeSmokeGroupKnives
    count: 2
  - prototype: N14KitchenKnife
    count: 2
  receive:
  - currency: Caps
    count: 10

# Barter receivePools use the same strict reward pool format as contracts.
- type: ncSupplyRewardPool
  id: NcTradeSmokeBarterReceivePoolBasic
  entries:
  - type: Currency
    currency: Caps
    count: { min: 1, max: 3 }
    weight: 3
  - type: Item
    prototype: FoodSnackChips
    count: 1
    weight: 1

# -----------------------------------------------------------------------------
# Contracts / Supply V2
# -----------------------------------------------------------------------------

- type: storeContractsPreset
  id: NcTradeSmokeContractsPreset
  contractOffers:
    maxVisible: 16
    groups:
    - pool: NcTradeSmokeOfferPoolSupply
      minVisible: 3
      maxVisible: 5
      fillWeight: 5
    - pool: NcTradeSmokeOfferPoolRetrieval
      minVisible: 11
      maxVisible: 11
      fillWeight: 5
    - pool: NcTradeSmokeOfferPoolHunt
      minVisible: 2
      maxVisible: 2
      fillWeight: 1
  skipCost: 0
  skipCurrency: Caps

- type: ncContractOfferPool
  id: NcTradeSmokeOfferPoolSupply
  name: "Поставки"
  order: 10
  color: "#9EBD6E"
  entries:
  - type: Supply
    id: NcTradeSmokeSupplyPrototypeTarget
    weight: 1
  - type: Supply
    id: NcTradeSmokeSupplyGroupTarget
    weight: 1
  - type: Supply
    id: NcTradeSmokeSupplyStackGroupTarget
    weight: 1
  - type: Supply
    id: NcTradeSmokeSupplyMultiTarget
    weight: 1
  - type: Supply
    id: NcTradeSmokeSupplyWeightedTargets
    weight: 1

- type: ncContractOfferPool
  id: NcTradeSmokeOfferPoolHunt
  name: "Охота"
  order: 30
  color: "#D86B58"
  entries:
  - type: Hunt
    id: NcTradeSmokeHuntTrophyTurnInRadroach
    weight: 1
  - type: Hunt
    id: NcTradeSmokeHuntTrophyTurnInRadroachGroup
    weight: 1
  - type: Hunt
    id: NcTradeSmokeHuntYaoguaiAndRadroaches
    weight: 1

- type: ncSupplyRewardPool
  id: NcTradeSmokeSupplyRewardPoolBasic
  entries:
  - type: Currency
    currency: Caps
    count: { min: 3, max: 6 }
    weight: 3
  - type: Item
    prototype: FoodSnackChips
    count: { min: 1, max: 2 }
    weight: 1

- type: ncSupplyRewardPool
  id: NcTradeSmokeSupplyRewardPoolNested
  entries:
  - type: Pool
    pool: NcTradeSmokeSupplyRewardPoolBasic
    count: 1
    weight: 1

- type: ncSupplyContract
  id: NcTradeSmokeSupplyPrototypeTarget
  name: "Поставка: снеки"
  description: "Принесите торговцу 2 пачки снеков."
  icon: FoodSnackChips
  targets:
  - prototype: FoodSnackChips
    count: 2
  reward:
  - type: Currency
    currency: Caps
    count: 5

- type: ncSupplyContract
  id: NcTradeSmokeSupplyGroupTarget
  name: "Поставка: кухонные ножи"
  description: "Принесите торговцу 2 подходящих ножа."
  icon: N14KitchenKnife
  targets:
  - group: NcTradeSmokeGroupKnives
    count: 2
  reward:
  - type: Item
    prototype: FoodSnackChips
    count: 1

- type: ncSupplyContract
  id: NcTradeSmokeSupplyStackGroupTarget
  name: "Поставка: медные слитки"
  description: "Принесите медные слитки. Большие стаки тоже должны засчитываться."
  icon: N14IngotCopper1
  targets:
  - group: NcTradeSmokeGroupCopperStacks
    count: 2
  reward:
  - type: Currency
    currency: Caps
    count: 6

- type: ncSupplyContract
  id: NcTradeSmokeSupplyMultiTarget
  name: "Поставка: ножи и медь"
  description: "Принесите ножи и медные слитки одним заказом."
  icon: N14IngotCopper1
  targets:
  - group: NcTradeSmokeGroupKnives
    count: 2
  - prototype: N14IngotCopper1
    count: 2
  reward:
  - type: Currency
    currency: Caps
    count: 12
  - type: Item
    prototype: FoodSnackChips
    count: { min: 0, max: 2 }

- type: ncSupplyContract
  id: NcTradeSmokeSupplyWeightedTargets
  name: "Поставка: случайная заявка"
  description: "Торговец выберет одну или две позиции из списка поставки."
  icon: FoodSnackChips
  targetCount: { min: 1, max: 2 }
  targets:
  - group: NcTradeSmokeGroupSnacks
    count: { min: 2, max: 4 }
    weight: 5
  - group: NcTradeSmokeGroupCopperStacks
    count: { min: 1, max: 3 }
    weight: 3
  - group: NcTradeSmokeGroupKnives
    count: { min: 1, max: 2 }
    weight: 1
  reward:
  - type: Pool
    pool: NcTradeSmokeSupplyRewardPoolNested
    count: 1

# -----------------------------------------------------------------------------
# Hunt V2 smoke content (stage 8.0-A: prototype + validation only)
# -----------------------------------------------------------------------------

- type: ncHuntGroup
  id: NcTradeSmokeHuntGroupRadroaches
  name: "Радтараканы"
  description: "Контрактные цели: обычные радтараканы."
  icon: N14MobRadroach
  prototypes:
  - N14MobRadroach

- type: entity
  id: NcTradeSmokeHuntProofRadroach
  parent: FoodSnackChips
  name: трофей радтаракана
  description: Финальный трофей Hunt V2. Появляется только после последнего нужного убийства.
  suffix: NC, Smoke, Hunt
  categories: [ HideSpawnMenu ]

- type: entity
  id: NcTradeSmokeHuntProofYaoguai
  parent: N14MaterialYaoguaiHide
  name: шкура вожака
  description: "Финальный трофей охоты: появляется только после убийства всех контрактных целей."
  suffix: NC, Smoke, Hunt
  categories: [ HideSpawnMenu ]

- type: ncHuntContract
  id: NcTradeSmokeHuntConfirmedKillRadroach
  name: "Охота: стая радтараканов"
  description: "Убейте указанное количество радтараканов."
  icon: N14MobRadroach
  targets:
  - group: NcTradeSmokeHuntGroupRadroaches
    count: 5
  completion:
    mode: ConfirmedKill
  spawn:
    point:
      type: MarkerId
      id: NcTradeSmokeHuntSpawn
  reward:
  - type: Currency
    currency: Caps
    count: 120

- type: ncHuntContract
  id: NcTradeSmokeHuntTrophyTurnInRadroach
  name: "Охота: трофей радтаракана"
  description: "Убейте 3 радтараканов и принесите финальный трофей торговцу."
  icon: N14MobRadroach
  targets:
  - prototype: N14MobRadroach
    count: 3
  completion:
    mode: TrophyTurnIn
    trophy: NcTradeSmokeHuntProofRadroach
  spawn:
    point:
      type: MarkerId
      id: NcTradeSmokeHuntSpawn
  reward:
  - type: Currency
    currency: Caps
    count: 180

- type: ncHuntContract
  id: NcTradeSmokeHuntTrophyTurnInRadroachGroup
  name: "Охота: гнездо радтараканов"
  description: "Убейте 3 цели из группы радтараканов и принесите финальный трофей."
  icon: N14MobRadroach
  targets:
  - group: NcTradeSmokeHuntGroupRadroaches
    count: 3
  completion:
    mode: TrophyTurnIn
    trophy: NcTradeSmokeHuntProofRadroach
  spawn:
    point:
      type: MarkerId
      id: NcTradeSmokeHuntSpawn
  reward:
  - type: Currency
    currency: Caps
    count: 200

- type: ncHuntContract
  id: NcTradeSmokeHuntYaoguaiAndRadroaches
  name: "Охота: вожак и мелочь"
  description: "Убейте контрактного яо-гая и двух радтараканов. Финальный трофей появится только после последней нужной цели."
  icon: N14MobYaoguai
  targets:
  - prototype: N14MobYaoguai
    count: 1
  - group: NcTradeSmokeHuntGroupRadroaches
    count: 2
  completion:
    mode: TrophyTurnIn
    trophy: NcTradeSmokeHuntProofYaoguai
  spawn:
    point:
      type: MarkerId
      id: NcTradeSmokeHuntSpawn
  reward:
  - type: Currency
    currency: Caps
    count: 300


# -----------------------------------------------------------------------------
# Retrieval Route Presets 5.8R
# -----------------------------------------------------------------------------

- type: entity
  id: NcTradeSmokeTraderTurnInBox
  parent: CrateGenericSteel
  name: контрактный ящик сдачи
  suffix: NC, Smoke
  components:
  - type: NcContractTurnInContainer
    groups:
    - NcTradeSmokeTraderBox

- type: ncRetrievalSourcePreset
  id: NcTradeSmokeSourceRetrievalMarker
  spawnCargo: true
  point:
    type: MarkerGroup
    id: NcTradeSmokeRetrieval

- type: ncRetrievalSourcePreset
  id: NcTradeSmokeSourceVendorPickup
  spawnCargo: true
  point:
    type: MarkerGroup
    id: NcTradeSmokeVendorPickup

- type: ncRetrievalDestinationPreset
  id: NcTradeSmokeDestinationStoreUi
  target:
    type: StoreUi

- type: ncRetrievalDestinationPreset
  id: NcTradeSmokeDestinationMarker
  target:
    type: MarkerGroup
    id: NcTradeSmokeRetrieval
  radius: 2.0

- type: ncRetrievalDestinationPreset
  id: NcTradeSmokeDestinationClinicDropoff
  target:
    type: MarkerGroup
    id: NcTradeSmokeClinicDropoff
  radius: 2.0

- type: ncRetrievalDestinationPreset
  id: NcTradeSmokeDestinationOutpostDropoff
  target:
    type: MarkerGroup
    id: NcTradeSmokeOutpostDropoff
  radius: 2.0

- type: ncRetrievalDestinationPreset
  id: NcTradeSmokeDestinationTraderBox
  target:
    type: ContainerGroup
    id: NcTradeSmokeTraderBox

- type: ncRetrievalProofPreset
  id: NcTradeSmokeProofBearerReceipt
  prototype: NcTradeSmokeDeliveryReceipt
  ownership: Bearer
  reissue: Never
  consumeOnRewardClaim: true

- type: entity
  parent: PaperOffice
  id: NcTradeSmokeDeliveryReceipt
  name: контрактная накладная
  description: "Подтверждение доставки контрактного груза. Верните эту накладную торговцу, чтобы получить награду."
  suffix: NC, Smoke
  categories: [ HideSpawnMenu ]
  components:
  - type: NcContractProof

- type: ncRetrievalGuidancePreset
  id: NcTradeSmokeGuidanceCargoToStore
  sourceHint: "Груз отмечен в контрактной зоне."
  destinationHint: "Верните накладную торговцу."
  pinpointer:
    enabled: true
    target: CargoThenDestinationThenStore
    prototype: PinpointerUniversal
    maxActive: 1

- type: ncRetrievalGuidancePreset
  id: NcTradeSmokeGuidanceVendorToClinic
  sourceHint: "Груз появился у торгового автомата."
  destinationHint: "Отнесите груз к указателю медпункта. После полной доставки заберите накладную и вернитесь к торговцу."
  pinpointer:
    enabled: true
    target: CargoThenDestinationThenStore
    prototype: PinpointerUniversal
    maxActive: 1

- type: ncRetrievalGuidancePreset
  id: NcTradeSmokeGuidanceVendorToOutpost
  sourceHint: "Груз появился у торгового автомата."
  destinationHint: "Отнесите груз к указателю аванпоста. После полной доставки заберите накладную и вернитесь к торговцу."
  pinpointer:
    enabled: true
    target: CargoThenDestinationThenStore
    prototype: PinpointerUniversal
    maxActive: 1

- type: ncRetrievalRoutePreset
  id: NcTradeSmokeRouteAnyToStoreUi
  source: NcTradeSmokeSourceRetrievalMarker
  destination: NcTradeSmokeDestinationStoreUi
  claim:
    mode: StoreCargo
  guidance: NcTradeSmokeGuidanceCargoToStore
  delivery:
    consumeCargo: true
    lockDeliveredCargo: false

- type: ncRetrievalRoutePreset
  id: NcTradeSmokeRouteMarkerToStoreUiTracked
  source: NcTradeSmokeSourceRetrievalMarker
  destination: NcTradeSmokeDestinationStoreUi
  claim:
    mode: StoreCargo
  guidance: NcTradeSmokeGuidanceCargoToStore
  delivery:
    consumeCargo: true
    lockDeliveredCargo: false

- type: ncRetrievalRoutePreset
  id: NcTradeSmokeRouteMarkerToMarkerProof
  source: NcTradeSmokeSourceRetrievalMarker
  destination: NcTradeSmokeDestinationMarker
  claim:
    mode: DestinationProof
    proof: NcTradeSmokeProofBearerReceipt
  guidance: NcTradeSmokeGuidanceCargoToStore
  delivery:
    consumeCargo: true
    lockDeliveredCargo: false

- type: ncRetrievalRoutePreset
  id: NcTradeSmokeRouteMarkerToTraderBoxProof
  source: NcTradeSmokeSourceRetrievalMarker
  destination: NcTradeSmokeDestinationTraderBox
  claim:
    mode: DestinationProof
    proof: NcTradeSmokeProofBearerReceipt
  guidance: NcTradeSmokeGuidanceCargoToStore
  delivery:
    consumeCargo: true
    lockDeliveredCargo: false

- type: ncRetrievalRoutePreset
  id: NcTradeSmokeRouteVendorToClinicProof
  source: NcTradeSmokeSourceVendorPickup
  destination: NcTradeSmokeDestinationClinicDropoff
  claim:
    mode: DestinationProof
    proof: NcTradeSmokeProofBearerReceipt
  guidance: NcTradeSmokeGuidanceVendorToClinic
  delivery:
    consumeCargo: true
    lockDeliveredCargo: false

- type: ncRetrievalRoutePreset
  id: NcTradeSmokeRouteVendorToOutpostProof
  source: NcTradeSmokeSourceVendorPickup
  destination: NcTradeSmokeDestinationOutpostDropoff
  claim:
    mode: DestinationProof
    proof: NcTradeSmokeProofBearerReceipt
  guidance: NcTradeSmokeGuidanceVendorToOutpost
  delivery:
    consumeCargo: true
    lockDeliveredCargo: false

# -----------------------------------------------------------------------------
# Contracts / Retrieval Route 5.8R
# -----------------------------------------------------------------------------

- type: ncContractOfferPool
  id: NcTradeSmokeOfferPoolRetrieval
  name: "Доставка"
  order: 20
  color: "#6BA7D8"
  entries:
  - type: Retrieval
    id: NcTradeSmokeRetrievalAnySnack
    weight: 1
  - type: Retrieval
    id: NcTradeSmokeRetrievalThreeSnacksStoreUi
    weight: 1
  - type: Retrieval
    id: NcTradeSmokeRetrievalTrackedSnackStoreUi
    weight: 1
  - type: Retrieval
    id: NcTradeSmokeRetrievalThreeCratesToMarkerProof
    weight: 1
  - type: Retrieval
    id: NcTradeSmokeRetrievalSnackToTraderBoxProof
    weight: 1
  - type: Retrieval
    id: NcTradeSmokeRetrievalPinpointerReadyToTurnIn
    weight: 1
  - type: Retrieval
    id: NcTradeSmokeRetrievalCargoCopperStoreCargo
    weight: 1
  - type: Retrieval
    id: NcTradeSmokeRetrievalCargoMaterialListStoreCargo
    weight: 1
  - type: Retrieval
    id: NcTradeSmokeRetrievalCargoMedicineBoxProof
    weight: 1
  - type: Retrieval
    id: NcTradeSmokeRetrievalVendorToClinicProof
    weight: 1
  - type: Retrieval
    id: NcTradeSmokeRetrievalVendorToOutpostProof
    weight: 1

- type: ncRetrievalContract
  id: NcTradeSmokeRetrievalAnySnack
  name: "Доставка: снек торговцу"
  description: "Заберите контрактный снек с маркера и доставьте его торговцу."
  icon: FoodSnackChips
  cargo:
  - prototype: FoodSnackChips
