# Retrieval guidance presets.
# Guidance does not control spawn or claim. It only provides player-facing hints and pinpointer behavior.

- type: ncRetrievalGuidancePreset
  id: NcRetrievalGuidanceObjectiveToStoreUi
  sourceHint: "Заберите контрактный груз в отмеченной зоне."
  destinationHint: "Доставьте этот груз торговцу и сдайте через интерфейс."
  pinpointer:
    enabled: true
    target: CargoThenDestinationThenStore
    prototype: PinpointerUniversal
    maxActive: 1

- type: ncRetrievalGuidancePreset
  id: NcRetrievalGuidanceObjectiveToDropoff
  sourceHint: "Груз находится в одной из контрактных зон."
  destinationHint: "Доставьте груз к точке выгрузки, получите доказательство и верните его торговцу."
  pinpointer:
    enabled: true
    target: CargoThenDestinationThenStore
    prototype: PinpointerUniversal
    maxActive: 1
