# NC Trade Retrieval cargo prototypes.
#
# Retrieval is spawned cargo delivery. These prototypes are intentionally
# separate from ordinary materials so a contract can track the exact spawned
# entity without accepting existing world stacks.

- type: stack
  id: NcTradeCargoCopperStack
  name: контрактная медь
  icon: { sprite: "/Textures/_Nuclear14/Objects/Misc/materials.rsi", state: ingot_copper }
  spawn: NcTradeCargoCopper
  maxCount: 1
  itemSize: 1

- type: stack
  id: NcTradeCargoScrapStack
  name: контрактный металлолом
  icon: { sprite: "/Textures/_Nuclear14/Objects/Misc/materials.rsi", state: scrap_2 }
  spawn: NcTradeCargoScrap
  maxCount: 1
  itemSize: 1

- type: entity
  parent: N14IngotCopper1
  id: NcTradeCargoCopper
  name: контрактный медный слиток
  description: "Отмеченный груз для доставки. Не является обычной поставкой материалов."
  suffix: NC, Trade Cargo
  categories: [ HideSpawnMenu ]
  components:
  - type: Stack
    stackType: NcTradeCargoCopperStack
    count: 1
    maxCountOverride: 1

- type: entity
  parent: N14Scrap1
  id: NcTradeCargoScrap
  name: контрактный металлолом
  description: "Отмеченный груз для доставки. Не сдаётся как обычный металлолом."
  suffix: NC, Trade Cargo
  categories: [ HideSpawnMenu ]
  components:
  - type: Stack
    stackType: NcTradeCargoScrapStack
    count: 1
    maxCountOverride: 1

- type: entity
  parent: N14CrateBreakPlainFilledStimpak
  id: NcTradeCargoMedicineBox
  name: контрактный медицинский ящик
  description: "Опечатанный медицинский груз. Доставьте именно этот ящик."
  suffix: NC, Trade Cargo
  categories: [ HideSpawnMenu ]

- type: ncItemGroup
  id: NcTradeCargoMaterialGroup
  name: "Контрактные материалы"
  description: "Контрактная медь или контрактный металлолом. Используется для проверки spawn-list Retrieval."
  icon: NcTradeCargoCopper
  prototypes:
  - NcTradeCargoCopper
  - NcTradeCargoScrap
