    type: MarkerGroup
    id: TradeContractDropoff
  radius: 2.0

- type: ncRetrievalDestinationPreset
  id: NcRetrievalDestinationPack1Camp
  target:
    type: MarkerGroup
    id: TradeContractDropoff
  radius: 2.0

- type: ncRetrievalGuidancePreset
  id: NcRetrievalGuidancePack1StoreCargo
  sourceHint: "Груз отмечен в одной из контрактных зон."
  destinationHint: "Доставьте груз торговцу и сдайте через интерфейс."
  pinpointer:
    enabled: true
    target: CargoThenDestinationThenStore
    prototype: PinpointerUniversal
    maxActive: 1

- type: ncRetrievalGuidancePreset
  id: NcRetrievalGuidancePack1Warehouse
  sourceHint: "Заберите груз с контрактной точки."
  destinationHint: "Доставьте груз на удаленный склад и верните торговцу накладную."
  pinpointer:
    enabled: true
    target: CargoThenDestinationThenStore
    prototype: PinpointerUniversal
    maxActive: 1

- type: ncRetrievalGuidancePreset
  id: NcRetrievalGuidancePack1RepairDepot
  sourceHint: "Груз ожидает вывоза из контрактной зоны."
  destinationHint: "Сдайте груз в ремонтный пункт и принесите подтверждение торговцу."
  pinpointer:
    enabled: true
    target: CargoThenDestinationThenStore
    prototype: PinpointerUniversal
    maxActive: 1

- type: ncRetrievalGuidancePreset
  id: NcRetrievalGuidancePack1Outpost
  sourceHint: "Заберите груз и удерживайте его до точки доставки."
  destinationHint: "Передайте груз на аванпост, затем вернитесь с подтверждением."
  pinpointer:
    enabled: true
    target: CargoThenDestinationThenStore
    prototype: PinpointerUniversal
    maxActive: 1

- type: ncRetrievalGuidancePreset
  id: NcRetrievalGuidancePack1Camp
  sourceHint: "Найдите продовольственный груз в зоне задания."
  destinationHint: "Доставьте его в лагерь и принесите торговцу накладную."
  pinpointer:
    enabled: true
    target: CargoThenDestinationThenStore
    prototype: PinpointerUniversal
    maxActive: 1

- type: ncRetrievalRoutePreset
  id: NcRetrievalRoutePack1ObjectiveToStoreCargo
  source: NcRetrievalSourceTradeContractObjective
  destination: NcRetrievalDestinationStoreUi
  claim:
    mode: StoreCargo
  guidance: NcRetrievalGuidancePack1StoreCargo
  delivery:
    consumeCargo: true
    lockDeliveredCargo: false

- type: ncRetrievalRoutePreset
  id: NcRetrievalRoutePack1ToRemoteWarehouseProof
  source: NcRetrievalSourceTradeContractObjective
  destination: NcRetrievalDestinationPack1RemoteWarehouse
  claim:
    mode: DestinationProof
    proof: NcRetrievalProofBearerDeliveryReceipt
  guidance: NcRetrievalGuidancePack1Warehouse
  delivery:
    consumeCargo: true
    lockDeliveredCargo: false

- type: ncRetrievalRoutePreset
  id: NcRetrievalRoutePack1ToRepairDepotProof
  source: NcRetrievalSourceTradeContractObjective
  destination: NcRetrievalDestinationPack1RepairDepot
