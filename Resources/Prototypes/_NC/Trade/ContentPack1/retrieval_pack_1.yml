# NC Trade 7.0 - Contract Content Pack 1 (Retrieval)

- type: ncRetrievalDestinationPreset
  id: NcRetrievalDestinationPack1RemoteWarehouse
  target:
    type: MarkerGroup
    id: TradeContractDropoff
  radius: 2.0

- type: ncRetrievalDestinationPreset
  id: NcRetrievalDestinationPack1RepairDepot
  target:
    type: MarkerGroup
    id: TradeContractDropoff
  radius: 2.0

- type: ncRetrievalDestinationPreset
  id: NcRetrievalDestinationPack1Outpost
