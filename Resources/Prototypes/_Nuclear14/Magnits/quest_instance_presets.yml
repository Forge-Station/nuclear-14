# Quest Instance Presets - Easy / Medium / Hard
# mapEntries supports per-map overrides:
#   mapPath: /Maps/Salvage/example.yml
#   weight: 3
#   biomeTemplateId: Wastes
#   weatherPrototypeId: Rain
#   atmosphereTemperatureCelsius: 20
#   timeCyclePaletteId: QuestDay
#
# Quest palettes:
#   Day: QuestDay
#   Morning: QuestMorning
#   Dusk: QuestDusk
#   Night: QuestNight

- type: questInstancePreset
  id: QuestInstanceEasy
  biomeTemplateId: Wastes
  timeLimitSeconds: 900          # 15 minutes
  barrierPadding: 60
  maxBarrierRadius: 200
  spawnDistanceFromGrid: 4
  warningThresholdsSeconds:
    - 60
    - 30
    - 10
  joinWindowSeconds: 120
  mapEntries:
    - mapPath: /Maps/Salvage/small-1.yml
      weight: 8
      weatherPrototypeId: Rain
      atmosphereTemperatureCelsius: 12
      timeCyclePaletteId: QuestDay
    - mapPath: /Maps/Salvage/small-2.yml
      weight: 6
      weatherPrototypeId: SnowfallHeavyExtreme
      atmosphereTemperatureCelsius: -24
      timeCyclePaletteId: QuestMorning
    - mapPath: /Maps/Salvage/small-3.yml
      weight: 5
      weatherPrototypeId: Default
      atmosphereTemperatureCelsius: 20
      timeCyclePaletteId: QuestDusk
    - mapPath: /Maps/Salvage/small-4.yml
      weight: 4
      weatherPrototypeId: Storm
      atmosphereTemperatureCelsius: 6
      timeCyclePaletteId: QuestNight
    - mapPath: /Maps/Salvage/small-a-1.yml
      weight: 5
      weatherPrototypeId: NCRadioactiveParticles
      atmosphereTemperatureCelsius: 34
      timeCyclePaletteId: QuestDay
    - mapPath: /Maps/Salvage/small-cargo.yml
      weight: 4
      weatherPrototypeId: NCRadioactiveRain
      atmosphereTemperatureCelsius: 30
      timeCyclePaletteId: QuestMorning
    - mapPath: /Maps/Salvage/small-ai-survey-drone.yml
      weight: 3
      weatherPrototypeId: Rain
      atmosphereTemperatureCelsius: 12
      timeCyclePaletteId: QuestDusk
    - mapPath: /Maps/Salvage/small-chapel.yml
      weight: 4
      weatherPrototypeId: Default
      atmosphereTemperatureCelsius: 20
      timeCyclePaletteId: QuestNight
    - mapPath: /Maps/Salvage/small-chef.yml
      weight: 3
      weatherPrototypeId: Storm
      atmosphereTemperatureCelsius: 6
      timeCyclePaletteId: QuestDay
    - mapPath: /Maps/Salvage/small-party.yml
      weight: 2
      weatherPrototypeId: Rain
      atmosphereTemperatureCelsius: 12
      timeCyclePaletteId: QuestMorning
    - mapPath: /Maps/Salvage/small-ship-1.yml
      weight: 5
      weatherPrototypeId: SnowfallHeavyExtreme
      atmosphereTemperatureCelsius: -24
      timeCyclePaletteId: QuestDusk
    - mapPath: /Maps/Salvage/hauling-shuttle.yml
      weight: 3
      weatherPrototypeId: NCRadioactiveStorm
      atmosphereTemperatureCelsius: 38
      timeCyclePaletteId: QuestNight
    - mapPath: /Maps/Salvage/cargo-1.yml
      weight: 4
      weatherPrototypeId: Default
      atmosphereTemperatureCelsius: 20
      timeCyclePaletteId: QuestDay

