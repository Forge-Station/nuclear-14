# Quest Instance Presets — Easy / Medium / Hard
# Each preset picks one map at random from its mapPaths list on instance creation.
# Biome is applied as background when biomeTemplateId is set.

- type: questInstancePreset
  id: QuestInstanceEasy
  biomeTemplateId: Wastes
  timeLimitSeconds: 900          # 15 minutes
  barrierPadding: 60
  maxBarrierRadius: 200
  spawnDistanceFromGrid: 4
  warningThresholdsSeconds:
    - 60
    - 30
    - 10
  joinWindowSeconds: 120
  mapPaths:
    - /Maps/Salvage/small-1.yml
    - /Maps/Salvage/small-2.yml
    - /Maps/Salvage/small-3.yml
    - /Maps/Salvage/small-4.yml
    - /Maps/Salvage/small-a-1.yml
    - /Maps/Salvage/small-cargo.yml
    - /Maps/Salvage/small-ai-survey-drone.yml
    - /Maps/Salvage/small-chapel.yml
    - /Maps/Salvage/small-chef.yml
    - /Maps/Salvage/small-party.yml
    - /Maps/Salvage/small-ship-1.yml
    - /Maps/Salvage/hauling-shuttle.yml
    - /Maps/Salvage/cargo-1.yml

