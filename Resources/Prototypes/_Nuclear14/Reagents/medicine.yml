      - !type:AdjustReagent
        reagent: CazadorVenom
        amount: -3.0
      - !type:AdjustReagent
        reagent: N14UncookedAnimalProteinsRad
        amount: -3.0
      - !type:AdjustReagent
        reagent: ScorpionTail
        amount: -3.0
      - !type:AdjustReagent
        reagent: N14LastBreathPoison
        amount: -5.0
      - !type:AdjustReagent
        reagent: N14TyaguchkaToxin
        amount: -5.0
      - !type:AdjustReagent
        reagent: N14ColourlessPoison
        amount: -5.0
      - !type:HealthChange
        damage:
          types:
            Poison: -3 # Forge-change

