#MARK: Healing
- type: reagent
  id: DirtyStimpak
  name: reagent-name-dirty-stimpak
  group: Medicine
  desc: reagent-desc-dirty-stimpak
  physicalDesc: reagent-physical-desc-soothing
  color: "#934435"
  metabolisms:
    Medicine:
      metabolismRate: 1
      effects:
      - !type:SatiateHunger
        factor: -2.5     
      - !type:HealthChange
        damage:
          groups:
            Burn: -16
            Brute: -12
            Airloss: -3
          types:
            Poison: 0.25
      - !type:ModifyBleedAmount
        amount: -1
      - !type:HealthChange # to prevent doping
        conditions:
        - !type:ReagentThreshold
          min: 12
        damage:
          groups:
            Burn: -8
            Brute: -6
            Airloss: -1.5
          types:
            Poison: 0.5
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 20
        damage:
          types:
            Poison: 2

- type: reagent
  id: HealingMixture #used in regular stimpacks
  name: reagent-name-healing-mixture
  group: Medicine
  desc: reagent-desc-healing-mixture
  physicalDesc: reagent-physical-desc-soothing
  color: "#934435"
  metabolisms:
    Medicine:
      metabolismRate: 1
      effects:
      - !type:SatiateHunger
        factor: -2.5
      - !type:HealthChange
        damage:
          groups:
            Burn: -20
            Brute: -15
            Airloss: -6
      - !type:ModifyBleedAmount
        amount: -2
      - !type:HealthChange # Bonus for poison
        conditions:
        - !type:ReagentThreshold
          min: 12
        damage:
          groups:
            Burn: -7.5
            Brute: -7.5
            Airloss: -4
          types:
            Poison: 2
      - !type:HealthChange # to prevent doping
        conditions:
        - !type:ReagentThreshold
          min: 20
        damage:
          types:
            Poison: 4

- type: reagent 
  id: RobustHealingMixture #used in super stimpacks
  name: reagent-name-robust-healing-mixture
  group: Medicine
  desc: reagent-desc-robust-healing-mixture
  physicalDesc: reagent-physical-desc-opaque
  color: "#934435"
  metabolisms:
    Medicine:
      metabolismRate: 1
      effects:
      - !type:SatiateThirst
        factor: -2.5
      - !type:SatiateHunger
        factor: -5
      - !type:MovespeedModifier
        walkSpeedModifier: 0.80
        sprintSpeedModifier: 0.80
      - !type:HealthChange
        damage:
          groups:
            Burn: -40
            Brute: -30
            Airloss: -15
      - !type:ModifyBleedAmount
        amount: -3
      - !type:HealthChange # Taking 2 is more or less a guaranteed death
        conditions:
        - !type:ReagentThreshold
          min: 12
        damage:
          groups:
            Burn: -20
            Brute: -15
            Airloss: -7.5
          types:
            Poison: 9
            Cellular: 1.5 # permanent damage, be glad you aint dead

