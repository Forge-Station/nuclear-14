#MARK: Poison
- type: reagent
  id: AntidoteMixture
  name: reagent-name-antidote-mixture
  group: Chems
  desc: reagent-desc-antidote-mixture
  physicalDesc: reagent-physical-desc-soothing
  color: "#982d1e"
  metabolisms:
    Medicine:
      metabolismRate: 0.1 # Slow
      effects:
      - !type:HealthChange
        conditions:
        damage:
          types:
            Poison: -0.2 # Forge-change
      - !type:AdjustReagent
        reagent: ScorpionTail
        amount: -1.0
      - !type:AdjustReagent
        reagent: N14UncookedAnimalProteinsRad
        amount: -1.0
      - !type:ChemVomit
        probability: 0.01
        conditions:
        - !type:ReagentThreshold
          min: 5

