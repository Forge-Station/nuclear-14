#MARK: Firetoxin
#Liquid found inside of fire ant stingers, it burns quite a lot.
- type: reagent
  id: FireToxin
  name: reagent-name-firetoxin
  group: Toxins
  desc: reagent-desc-firetoxin
  flavor: tingly
  color: "#cf3600"
  physicalDesc: reagent-physical-desc-burning
  plantMetabolism:
  - !type:PlantAdjustToxins
    amount: 10
  - !type:PlantAdjustHealth
    amount: -5
  metabolisms:
    Poison:
      effects:
      - !type:HealthChange
        damage:
          types:
            Heat: 3
            Poison: 2
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentThreshold
          reagent: Antidote
          max: 0.01
        key: Drowsiness
        time: 10
        type: Remove
      - !type:PopupMessage
        type: Local
        messages: [ "histamine-effect-light-itchiness" ]
        probability: 0.1
      - !type:PopupMessage
        conditions:
        - !type:ReagentThreshold
          min: 5
        type: Local
        visualType: Medium
        messages: [ "histamine-effect-heavy-itchiness" ]
        probability: 0.2

#MARK: Nightstalker Venom
#While not nearly as potent as cazador venom and is a lot slower acting, it will still kill in multiple bites
- type: reagent
  id: NightstalkerVenom
  name: reagent-name-nightstalker-venom
  group: Toxins
  desc: reagent-desc-nightstalker-venom
  flavor: terrible
  color: "#cf3600"
  physicalDesc: reagent-physical-desc-viscous
  plantMetabolism:
  - !type:PlantAdjustToxins
    amount: 10
  - !type:PlantAdjustHealth
    amount: -5
  metabolisms:
    Poison:
      metabolismRate: 0.1 #Very Slow acting, default 0.5
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 1
          groups:
            Airloss: 2
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentThreshold
          reagent: Antidote
          max: 0.01
        key: Drowsiness
        time: 10
        type: Remove

#MARK: Cazador Venom
#Insanely potent venom which while acts at half speed, can knock down just about anyone in just a few injections
- type: reagent
  id: CazadorVenom
  name: reagent-name-cazador-venom
  group: Toxins
  desc: reagent-desc-cazador-venom
  flavor: terrible
  color: "#cf3600"
  physicalDesc: reagent-physical-desc-bubbling
  plantMetabolism:
  - !type:PlantAdjustToxins
    amount: 10
  - !type:PlantAdjustHealth
    amount: -5
  metabolisms:
    Poison:
      metabolismRate: 0.2 #Slow acting, default 0.5
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 3
          groups:
            Airloss: 3.5
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentThreshold
          reagent: Antidote
          max: 0.01
        key: Drowsiness
        time: 10
        type: Remove   

#MARK: Scorpion Venom
# Оказывается у скорпиона не было своего яда. Сделал.    
- type: reagent
  id: ScorpionTail
  name: reagent-name-scorpiontail
  group: Toxins
  desc: reagent-desc-scorpiontail
  physicalDesc: reagent-physical-desc-clumpy
  color: "#b0ff7b"
  plantMetabolism:
  - !type:PlantAdjustToxins
    amount: 10
  - !type:PlantAdjustHealth
    amount: -5
  metabolisms:
    Poison:
      metabolismRate: 0.01 #super slow acting, default 0.5
      effects:
      - !type:HealthChange
        conditions:
        - !type:OrganType
          type: Human
        damage:
          types:
            Poison: 0.22
      - !type:MovespeedModifier
        walkSpeedModifier: 0.9
        sprintSpeedModifier: 0.9
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentThreshold
          reagent: Antidote
          max: 0.01
        - !type:ReagentThreshold
          reagent: AntidoteMixture
          max: 0.01
        key: Drowsiness
        time: 10
        type: Remove  

