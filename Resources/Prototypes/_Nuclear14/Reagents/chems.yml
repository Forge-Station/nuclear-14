#MARK: Tribal Chems
- type: reagent
  id: MourningPoultice
  name: reagent-name-mourning-poultice
  group: Medicine
  desc: reagent-desc-mourning-poultice
  physicalDesc: reagent-physical-desc-oily
  color: "#1d3d22"
  metabolisms:
    Medicine:
      metabolismRate: 0.2 # Effectively once every 5 seconds.
      effects:
      - !type:HealthChange
        damage:
          groups:
            Toxin: 0.5
          types:
            Radiation: 0.5
        conditions:
        - !type:Species
          species:
          - GhoulGlowing
          shouldHave: false
      - !type:ModifyBleedAmount
        amount: 0.1
      - !type:GenericStatusEffect
        key: SeeingRainbows
        component: SeeingRainbows
        type: Add
        time: 5
        refresh: false
      - !type:GenericStatusEffect
        key: Stutter
        component: ScrambledAccent
      - !type:GenericStatusEffect
        key: SlurredSpeech
        component: TelepathicRepeater
      - !type:PopupMessage
        type: Local
        visualType: Medium
        messages: [ "generic-reagent-effect-sick" ]
        probability: 0.2    

