#MARK: Chems
- type: reagent
  id: MovespeedMixture #used in jet
  name: reagent-name-movespeedmod-mixture
  group: Chems
  desc: reagent-desc-healing-mixture
  physicalDesc: reagent-physical-desc-refreshing
  color: "#7fb851"
  metabolisms:
    Medicine:
      effects:
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 20
        damage:
          types:
            Poison: 1 
            Asphyxiation: 1
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentThreshold
          reagent: Fixer
          max: 0.01
        key: Drowsiness
        time: 10
        type: Remove
      - !type:MovespeedModifier
        walkSpeedModifier: 1.1
        sprintSpeedModifier: 1.1
      - !type:GenericStatusEffect
        key: SeeingRainbows
        component: SeeingRainbows
        type: Add
        time: 5
        refresh: false
      - !type:Jitter
      - !type:GenericStatusEffect
        key: Stun
        time: 3
        type: Remove
      - !type:GenericStatusEffect
        key: KnockedDown
        time: 3
        type: Remove
    Narcotic:
      effects:
      - !type:ChemAddMoodlet
        moodPrototype: JetBenefit
      - !type:PopupMessage
        type: Local
        messages:
        - ephedrine-effect-tight-pain
        - histamine-effect-light-itchiness
        - leporazine-effect-temperature-adjusting
        - mannitol-effect-enlightened
        - psicodine-effect-fearless
        - psicodine-effect-anxieties-wash-away
        - psicodine-effect-at-peace
        probability: 0.08

- type: reagent
  id: RobustMovespeedMixture #used in turbo
  name: reagent-name-robust-movespeedmod-mixture
  group: Chems
  desc: reagent-name-robust-movespeedmod-mixture
  physicalDesc: reagent-physical-desc-powdery
  color: "#D2FFFA"
  boilingPoint: 255.0
  meltingPoint: 36.0
  metabolisms:
    Narcotic:
      effects:
      - !type:MovespeedModifier
        walkSpeedModifier: 1.30
        sprintSpeedModifier: 1.30
      - !type:Drunk
      - !type:HealthChange
        damage:
          types:
            Poison: 0.5
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 20
        damage:
          types:
            Poison: 2 # this is added to the base damage of the meth.
            Asphyxiation: 2
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentThreshold
          reagent: Fixer
          max: 0.01
        key: Drowsiness
        time: 10
        type: Remove
      - !type:GenericStatusEffect
        key: Stun
        time: 5
        type: Remove
      - !type:GenericStatusEffect
        key: KnockedDown
        time: 5
        type: Remove
      - !type:PopupMessage
        type: Local
        visualType: Medium
        messages: [ "ephedrine-effect-heart-pounds" ]
        probability: 0.2

- type: reagent
  id: DamageModifyingMixture #used in psycho. TODO: figure out how to make a reagent give you a dmg buff
  name: reagent-name-damage-mod-mixture
  group: Chems
  desc: reagent-desc-damage-mod-mixture
  physicalDesc: reagent-physical-desc-volatile
  color: "#9A040E"
  metabolisms:
    Narcotic:
      metabolismRate: 0.25
      effects:
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentThreshold
          reagent: Fixer
          max: 0.01
        key: Drowsiness
        time: 10
        type: Remove
      - !type:HealthChange
        damage:
          types:
            Poison: 0.25
      - !type:HealthChange
        conditions:
          - !type:ReagentThreshold
            min: 25
        damage:
          types:
            Poison: 2 # this is added to the base damage of the meth.
            Asphyxiation: 2
      - !type:Jitter
      - !type:PopupMessage
        type: Local
        visualType: Medium
        messages: [ "psicodine-effect-fearless", "barozine-effect-muscle-contract" ]
        probability: 0.1     
      - !type:Emote
        emote: Scream
        probability: 0.05
      - !type:MovespeedModifier
        walkSpeedModifier: 1.2
        sprintSpeedModifier: 1.2
      - !type:GenericStatusEffect
        key: ForcedSleep
        time: 3
        type: Remove
      - !type:GenericStatusEffect
        key: Stun
        time: 3
        type: Remove
      - !type:GenericStatusEffect
        key: KnockedDown
        time: 3
        type: Remove
      - !type:GenericStatusEffect
        key: StaminaModifier
        component: StaminaModifier
        time: 3
        type: Add
    Medicine:
      metabolismRate: 0.25
      effects:
        - !type:ResetNarcolepsy
        - !type:HealthChange
          conditions:
          - !type:TotalDamage
            min: 50
            max: 150 #you've got a chance to get out of crit
          damage:
            groups:
              Burn: -7.5
              Brute: -7.5
        - !type:HealthChange
          conditions:
            - !type:ReagentThreshold
              min: 30
          damage:
            types:
              Poison: 1

