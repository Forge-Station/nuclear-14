#MARK: Uniform's
- type: constructionGraph
  id: WastelanderRagsGraph
  start: start
  graph:
  - node: start
    edges:
      - to: rags
        steps:
        - material: Cloth
          amount: 4
          doAfter: 8
  
  - node: rags
    entity: N14ClothingUniformJumpsuitRags

- type: constructionGraph
  id: CoatFollowersArmoredGraph
  start: start
  graph:
  - node: start
    edges:
      - to: followercoat
        steps:
        - tag: FollowerLabcoat
          name: follower's labcoat
          icon:
            sprite: _Nuclear14/Clothing/OuterClothing/Coats/falloutfollowerlabcoat.rsi
            state: icon
        - tag: PoliceVest
          name: police vest
          icon:
            sprite: _Nuclear14/Clothing/OuterClothing/Armor/falloutpolicevest.rsi
            state: icon
          doAfter: 8

  - node: followercoat
    entity: N14ClothingOuterCoatFollowersArmored

#MARK: Mantie's
- type: constructionGraph
  id: LeatherMantleGraph
  start: start
  graph:
  - node: start
    edges:
      - to: mantle
        steps:
        #forge-start-change
        - material: RawLeather
          amount: 2
        - material: N14Sinew
          amount: 2
          doAfter: 4
        #forge-end-change

  - node: mantle
    entity: N14ClothingNeckMantleLeather

- type: constructionGraph
  id: LeatherCloakGraph
  start: start
  graph:
  - node: start
    edges:
      - to: cloak
        steps:
        #forge-start-change
        - material: RawLeather
          amount: 2
        - material: N14Sinew
          amount: 2
          doAfter: 4
        #forge-end-change

  - node: cloak
    entity: N14ClothingNeckCloakLeather

- type: constructionGraph
  id: YaoguaiCloakGraph
  start: start
  graph:
  - node: start
    edges:
      - to: cloak
        steps:
        - tag: YaoguaiHide
          name: Yao Guai hide
          icon:
            sprite: _Nuclear14/Objects/Misc/mob_drops.rsi
            state: hide_yaoguai
        #forge-start-change
        - material: N14Sinew
          amount: 2
          doAfter: 8
        #forge-end-change

  - node: cloak
    entity: N14ClothingNeckCloakYaoguai

#MARK: Gloves
- type: constructionGraph
  id: GlovesClothGraph
  start: start
  graph:
  - node: start
    edges:
      - to: gloves
        steps:
        - material: Cloth
          amount: 2
          doAfter: 4

  - node: gloves
    entity: N14ClothingHandsGlovesCloth

#MARK: Hats
- type: constructionGraph
  id: NightstalkerhatGraph
  start: start
  graph:
  - node: start
    edges:
      - to: head
        steps:
        - tag: NightstalkerPelt
          name: nightstalker pelt
          icon:
            sprite: _Nuclear14/Objects/Misc/mob_drops.rsi
            state: pelt_nightstalker
        #forge-start-change
        - material: N14Sinew
          amount: 2
          doAfter: 8
        #forge-end-change

  - node: head
    entity: N14ClothingHeadHatNightstalker
