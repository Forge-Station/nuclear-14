- type: constructionGraph
  id: N14BaseballNade
  start: start
  graph:
    - node: start
      edges:
        - to: baseballnade
          steps:
            - material: N14Gunpowder
              amount: 8
            - tag: Baseball
              name: baseball
              icon:
                sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
                state: baseball
            - tag: N14Igniter
              name: igniter
              icon:
                sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
                state: igniter
              doAfter: 35
    - node: baseballnade
      entity: N14BaseballNade

