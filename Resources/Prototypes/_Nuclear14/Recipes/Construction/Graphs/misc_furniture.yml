# Curtains
- type: constructionGraph
  id: N14JunkCurtainOpenGraph
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: N14JunkCurtainOpen
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: Cloth
              amount: 3
              doAfter: 2

    - node: N14JunkCurtainOpen
      entity: N14JunkCurtainOpen
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialCloth1
              amount: 3
            - !type:DeleteEntity {}
          steps:
            - tool: Cutting
              doAfter: 2

