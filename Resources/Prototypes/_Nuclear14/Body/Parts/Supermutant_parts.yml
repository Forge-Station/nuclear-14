# Forge-Change
- type: entity
  id: PartSupermutant
  parent: [BaseItem, BasePart]
  name: "Supermutant body part"
  abstract: true
  components:
  - type: Damageable
    damageContainer: OrganicPart # Shitmed Change
    damageModifierSet: SupermutantPartDamage
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoSupermutant
  name: "Supermutant torso"
  parent: [PartSupermutant, BaseTorso]
  components:
  - type: Sprite
    sprite: _Nuclear14/Mobs/Species/Supermutant/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 40
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 2500
      behaviors:
      - !type:GibPartBehavior {}
    - trigger:
        !type:DamageTypeTrigger
        damageType: Piercing
        damage: 2500
      behaviors:
      - !type:GibPartBehavior {}
    - trigger:
        !type:DamageTypeTrigger
        damageType: Slash
        damage: 2500
      behaviors:
      - !type:GibPartBehavior {}
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 2500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          Ash:
            min: 2
            max: 5
      - !type:BurnBodyBehavior {}
      - !type:PlaySoundBehavior
        sound:
          collection: MeatLaserImpact

