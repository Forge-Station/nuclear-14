- type: entity
  name: cardboard box
  parent: BaseItem
  id: N14BoxPlastic
  description: An old plastic box for storing things.
  components:
  - type: Item
    size: Normal
  - type: Sprite
    scale: 0.8, 0.8
    sprite: _Nuclear14/Objects/Misc/storage.rsi
    state: box

- type: entity
  name: wastelander box
  parent: N14BoxPlastic
  id: N14BoxPlasticFilledWastelander
  components:
    - type: SpawnItemsOnUse #Forge-Change
      items:
        - id: Flare
          amount: 3
        - id: N14RadXPill
          amount: 1
        - id: N14CleanGauze10
          amount: 1
      sound:
        path: /Audio/Items/can_open3.ogg          

- type: entity
  name: military box
  parent: N14BoxPlastic
  id: N14BoxPlasticFilledMilitary
  components:
    - type: SpawnItemsOnUse #Forge-Change
      items:
        - id: N14Stimpak
          prob: 0.7
          orGroup: RandomMed
        - id: N14ChemicalSyringeAntidote
          prob: 0.2
          orGroup: RandomMed
        - id: N14SuperStimpak
          prob: 0.1
          orGroup: RandomMed
        - id: N14CleanGauze10
          amount: 1
        - id: N14RadXPill
          amount: 1
        - id: N14CurrencyCap10
          prob: 0.6
          orGroup: StashCash
        - id: N14CurrencyCap50
          prob: 0.3
          orGroup: StashCash
        - id: N14CurrencyCap100
          prob: 0.1
          orGroup: StashCash
        - id: Flare
          amount: 2
      sound:
        path: /Audio/Items/can_open3.ogg

