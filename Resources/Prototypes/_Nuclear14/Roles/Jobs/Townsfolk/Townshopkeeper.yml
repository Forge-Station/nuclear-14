- type: job
  id: TownShopkeeper
  setPreference: true
  overrideConsoleVisibility: false
  canBeAntag: false
  name: job-name-townshopkeeper
  description: job-description-townshopkeeper
  playTimeTracker: TownShopkeeper
  requirements:
    # Forge-Change-Del - !type:CharacterSpeciesRequirement
      # Forge-Change-Del species:
      # Forge-Change-Del - Human
      # Forge-Change-Del - Ghoul
    # Forge-Change-Del - !type:CharacterDepartmentTimeRequirement
      # Forge-Change-Del department: Townsfolk
      # Forge-Change-Del min: 7200 # 2 hours
    # Forge-Change-Del - !type:CharacterPlaytimeRequirement # Forge-Add
      # Forge-Change-Del tracker: TownShopkeeperHelper
      # Forge-Change-Del min: 14400 # 4 hours
  # Forge-Change-Start
  - !type:CharacterSpeciesRequirement
    species:
    - Human
    - Ghoul
  - !type:CharacterDepartmentTimeRequirement
    department: Townsfolk
    min: 7200 # 2 hours
  - !type:CharacterPlaytimeRequirement # Forge-Add
    tracker: TownShopkeeperHelper
    min: 14400 # 4 hours
  # Forge-Change-End
  startingGear: TownShopkeeperGear
  icon: "JobIconTownShopKeeper" # Forge-Change
  supervisors: job-supervisors-townsfolk
  alwaysUseSpawner: true # Forge-Change
  access:
  - TownieShopkeeper
  - TownsPerson # Forge-Change
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - Townsfolk
      - type: ProfessionalChef

- type: startingGear
  id: TownShopkeeperGear
  equipment:
    jumpsuit: N14ClothingUniformJumpsuitMerchant
    back: N14ClothingBackpackHiking # Forge-Change
    shoes: N14ClothingShoesBlack
    id: N14IDShopkeeperTown
    belt: N14WalletCash
  innerClothingSkirt: N14ClothingUniformJumpskirtFalloutBlack
  satchel: N14ClothingBackpackSatchelWastelanderFilled
  duffelbag: N14ClothingBackpackDuffelFilled  # N14TODO: Trader bag
  storage: # Forge-Change
    back:
    - N14BoxPlasticFilledWastelander

- type: playTimeTracker
  id: TownShopkeeper
