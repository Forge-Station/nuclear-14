- type: job
  id: NCRRangerVeteran
  setPreference: true
  overrideConsoleVisibility: false
  canBeAntag: false
  name: job-name-ncr-ranger-veteran
  description: job-description-ncr-ranger-veteran
  playTimeTracker: NCRRangerVeteran
  requirements:
  # Forge-Change-Start
  - !type:CharacterSpeciesRequirement
    species:
    - Human
    - Ghoul
  - !type:CharacterPlaytimeRequirement
    tracker: NCRRanger
    min: 216000 # 60 hours as NCR
  - !type:CharacterWhitelistRequirement
  # Forge-Change-End
  startingGear: NCRRangerVeteranGear
  icon: "JobIconNcrVeteranRanger" # Forge-Change
  supervisors: job-supervisors-ncr # Forge-Change
  requireAdminNotify: true
  access:
  - RadioBroadcast
  - NCR
  - NCRSGT
  - NCRMedic
  - NCRRanger
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - NCR
      - type: RoleBonus
        healthBonus: 30
        walkSpeedMultiplier: 1.2
        sprintSpeedMultiplier: 1.2
        slowOnDamageModifier: 0.5
        medicalSpeed: 1.25
        fireRateBonus: 1.5
        fireRateWhitelist:
        - N14WeaponSniper44LeverCarbine
        - N14WeaponSniper44LeverShortCarbine
        - N14WeaponSniper308LeverRifle
        - N14WeaponSniper45-70BrushGun
        - N14WeaponSniper308Tribal
        - N14WeaponSniper308TribalUpgraded
        - N14WeaponShotgunLever
        - N14WeaponRevolver9mm
        - N14WeaponRevolver10mm
        - N14WeaponRevolverWebley
        - N14WeaponRevolver44Magnun
        - N14WeaponRevolver45-70Hunter
        - N14WeaponRevolver45-70RangerSequoia
        - N14WeaponRevolverThatGun
        - N14WeaponRevolver12-7x55mmRSH12
        - N14WeaponRevolver44Tribal
        - N14WeaponRevolver44TribalUpgraded
        - N14WeaponRevolver44TribalUpgradedExtra
        - N14WeaponRevolver45-70Handcannon
        - N14WeaponRevolver45-70HandcannonUpgraded

- type: startingGear
  id: NCRRangerVeteranGear
  equipment:
    jumpsuit: N14ClothingUniformRangerVeteran
    shoes: N14ClothingBootsCombatMK2Filled
    ears: N14ClothingHeadsetNCR
    gloves: N14ClothingHandsGlovesCombat
    belt: ClothingBeltRevolvervetfilled
    mask: ClothingMaskGasRangerOld
    eyes: ClothingEyesGlassesSunglasses
    neck: N14ClothingNeckCloakRanger
    pocket1: MagazineBox45-70
    pocket2: NCRveteranrangerloadoutkits
    outerClothing: N14ClothingOuterRangerCombat
    head: N14ClothingHeadHatRangerHelmetOld
    id: N14IDBadgeNCRRangerElite
    back: N14ClothingBackpackMilitary # Forge-Change
  innerClothingSkirt: N14ClothingUniformRangerModif #placeholder
  satchel: N14ClothingBackpackSatchelMilitaryFilled
  duffelbag: N14ClothingBackpackDuffelMilitaryFilled
  storage: # Forge-Change
    back:
    - N14BoxPlasticFilledMilitary

- type: playTimeTracker
  id: NCRRangerVeteran
