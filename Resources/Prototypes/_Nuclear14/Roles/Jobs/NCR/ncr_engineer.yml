- type: job
  id: NCREngineer
  setPreference: true
  overrideConsoleVisibility: false
  canBeAntag: false
  name: job-name-ncr-engineer
  description: job-description-ncr-engineer
  playTimeTracker: NCREngineer
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
      - Ghoul
    - !type:CharacterDepartmentTimeRequirement
      department: NCR
      min: 18000 # 5 hours
  startingGear: NCREngineerGear
  icon: "JobIconWarden"
  supervisors: job-supervisors-ncr
  alwaysUseSpawner: true
  access:
  - NCR
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - NCR

- type: startingGear
  id: NCREngineerGear
  equipment:
    head: N14ClothingHeadHatNCRHelmet # Forge-Change
    back: N14ClothingBackpackNCR # Forge-Change
    jumpsuit: N14ClothingUniformNCR # Forge-Change
    outerClothing: N14ClothingOuterNCRVest # Forge-Change
    belt: N14ClothingBeltUtilityFilled # Forge-Change
    shoes: N14ClothingBootsLeatherFilled
    gloves: N14ClothingHandsGlovesCombat
    eyes: N14ClothingEyesGlassesWelding # Forge-Change
    id: N14IDNCRDogtagEngineer
    pocket1: NCRengineerloadoutkits
  innerClothingSkirt: N14ClothingUniformNCR # Forge-Change
  satchel: N14ClothingBackpackSatchelNCRFilled
  storage: # Forge-Change
    back:
    - N14BoxPlasticFilledMilitaryNCR

- type: playTimeTracker
  id: NCREngineer
