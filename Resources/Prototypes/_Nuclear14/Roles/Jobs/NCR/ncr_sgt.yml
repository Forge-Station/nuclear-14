- type: job
  id: NCRSGT
  setPreference: true
  overrideConsoleVisibility: false
  canBeAntag: false
  name: job-name-ncr-sgt
  description: job-description-ncr-sgt
  playTimeTracker: NCRNCO
  ranks: # Forge-Change
    - rank: NCRSergeantMajor
      requirements:
        - !type:CharacterPlaytimeRequirement
          tracker: NCRNCO
          min: 216000 # 3600 minutes
    - rank: NCRMasterSergeant
      requirements:
        - !type:CharacterPlaytimeRequirement
          tracker: NCRNCO
          min: 144000 # 2400 minutes
    - rank: NCRSeniorSergeant
      requirements:
        - !type:CharacterPlaytimeRequirement
          tracker: NCRNCO
          min: 72000 # 1200 minutes
    - rank: NCRSergeant
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
      - Ghoul
    - !type:CharacterDepartmentTimeRequirement
      department: NCR
      min: 72000 # 20 hours Corvax-Change
    - !type:CharacterPlaytimeRequirement # Corvax-Add
      tracker: NCRSoldier
      min: 36000 # 10 hours
  startingGear: NCRSGTGear
  icon: "JobIconNcrSerg" # Forge-Change
  supervisors: job-supervisors-ncr-sgt
  alwaysUseSpawner: true
  access:
  - NCR
  - NCRSGT
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - NCR

- type: startingGear
  id: NCRSGTGear
  equipment:
    back: N14ClothingBackpackNCR # Forge-Change
    gloves: N14ClothingHandsGlovesCombat
    jumpsuit: N14ClothingOfficerUniformNCRDesert # Forge-Change
    shoes: N14ClothingBootsCombatFilled
    neck: N14ClothingNeckMantleNCR
    belt: ClothingBeltNCR
    outerClothing: N14ClothingOuterNCRCombatArmor
    head: N14ClothingHeadHatNCRHelmet # Forge-Change
    pocket1: NCRSGTloadoutkits
    pocket2: RadioHandheld
    id: N14IDNCRDogtagNCO
  innerClothingSkirt: N14ClothingOfficerUniformNCRDesert # Forge-Change
  satchel: N14ClothingBackpackSatchelNCRFilled
  storage: # Forge-Change
    back:
    - N14BoxPlasticFilledMilitaryNCR

- type: playTimeTracker
  id: NCRNCO
