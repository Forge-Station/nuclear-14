- type: job
  id: NCRSoldier
  setPreference: true
  overrideConsoleVisibility: false
  canBeAntag: false
  name: job-name-ncr-soldier
  description: job-description-ncr-soldier
  playTimeTracker: NCRSoldier
  requirements:
    # Forge-Change-Del - !type:CharacterSpeciesRequirement
      # Forge-Change-Del species:
      # Forge-Change-Del - Human
      # Forge-Change-Del - Ghoul
    # Forge-Change-Del - !type:CharacterDepartmentTimeRequirement
      # Forge-Change-Del department: NCR
      # Forge-Change-Del min: 10800 # 3 hours Corvax-Change
  # Forge-Change-Start
  - !type:CharacterSpeciesRequirement
    species:
    - Human
    - Ghoul
  - !type:CharacterDepartmentTimeRequirement
    department: NCR
    min: 10800 # 3 hours Corvax-Change
  # Forge-Change-End
  startingGear: NCRSoldierGear
  icon: "JobIconNcrSoldier" # Forge-Change
  supervisors: job-supervisors-ncr
  alwaysUseSpawner: true
  access:
  - NCR
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - NCR

- type: startingGear
  id: NCRSoldierGear
  equipment:
    head: N14ClothingHeadHatNCRHelmet # Forge-Change
    back: N14ClothingBackpackNCR # Forge-Change
    jumpsuit: N14ClothingUniformNCR # Forge-Change
    outerClothing: N14ClothingOuterNCRVest # Forge-Change
    belt: ClothingBeltNCR # Forge-Change
    shoes: N14ClothingBootsLeatherFilled
    id: N14IDNCRDogtag
    pocket1: NCRtrooperloadoutkits
  innerClothingSkirt: N14ClothingUniformNCR # Forge-Change
  satchel: N14ClothingBackpackSatchelNCRFilled
  storage: # Forge-Change
    back:
    - N14BoxPlasticFilledMilitaryNCR

- type: playTimeTracker
  id: NCRSoldier
