- type: job
  id: TribalElder
  setPreference: true
  overrideConsoleVisibility: false
  canBeAntag: false
  name: job-name-tribal-elder
  description: job-description-tribal-elder
  playTimeTracker: TribalElder
  requirements:
    # Forge-Change-Del - !type:CharacterSpeciesRequirement
      # Forge-Change-Del species:
      # Forge-Change-Del - Human
      # Forge-Change-Del - Ghoul
    # Forge-Change-Del - !type:CharacterDepartmentTimeRequirement
      # Forge-Change-Del department: Tribe
      # Forge-Change-Del min: 14400 # 4 hours
  # Forge-Change-Start
  - !type:CharacterSpeciesRequirement
    species:
    - Human
    - Ghoul
  - !type:CharacterDepartmentTimeRequirement
    department: Tribe
