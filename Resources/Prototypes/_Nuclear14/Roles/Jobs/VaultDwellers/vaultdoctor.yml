- type: job
  id: VaultDoctor
  name: job-name-vault-doctor
  description: job-description-vault-doctor
  # Forge-Change-Start
  setPreference: true
  overrideConsoleVisibility: true
  canBeAntag: false
  playTimeTracker: VaultDoctor
  # Forge-Change-End
  requirements:
  # Forge-Change-Del - !type:MinPlayersRequirement
    # Forge-Change-Del min: 20 # Forge-Change
  - !type:CharacterSpeciesRequirement
    species:
    - Human
  - !type:CharacterDepartmentTimeRequirement
    department: Vault
    min: 7200 # 2 hours
  # Forge-Change-Del setPreference: true
  # Forge-Change-Del overrideConsoleVisibility: true
  # Forge-Change-Del canBeAntag: false
  # Forge-Change-Del playTimeTracker: VaultDoctor
  # Forge-Change-Start
  - !type:MinPlayersRequirement
    min: 20 # Forge-Change
  # Forge-Change-End
  startingGear: VaultDoctorGear
  alwaysUseSpawner: true
  icon: "JobIconVaultMedic" # Forge-Change
  supervisors: job-supervisors-vault
  access:
  - VaultDweller
  - VaultMedical
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - Vault
      - type: CPRTraining


- type: startingGear
  id: VaultDoctorGear
  equipment:
    jumpsuit: N14ClothingUniformJumpsuitVault14
    back: N14ClothingBackpackVaultBlue # Forge-Change
    shoes: N14ClothingBootsBlack
    outerClothing: N14ClothingOuterCoatLab
    id: N14VaultDoctorPDA
    ears: N14ClothingHeadsetVaultDweller
    belt: ClothingBeltMedicalFilled
  innerClothingSkirt: N14ClothingUniformJumpsuitVault14
  storage: # Forge-Change
    back:
    - N14CleanGauze10
    - N14Antidote
    - Portafib
    - N14CurrencyPrewarMoney100
    - N14CurrencyPrewarMoney100

- type: playTimeTracker
  id: VaultDoctor
