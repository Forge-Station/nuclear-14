- type: job
  id: VaultDweller
  name: job-name-vault-dweller
  description: job-description-vault-dweller
  # Forge-Change-Del requirements:
  # Forge-Change-Del - !type:MinPlayersRequirement
    # Forge-Change-Del min: 20 # Forge-Change
  # Forge-Change-Del - !type:CharacterSpeciesRequirement
    # Forge-Change-Del species:
    # Forge-Change-Del - Human
  setPreference: true
  overrideConsoleVisibility: true
  canBeAntag: false
  playTimeTracker: VaultDweller
  # Forge-Change-Start
  requirements:
  - !type:CharacterSpeciesRequirement
    species:
    - Human
  - !type:MinPlayersRequirement
    min: 20 # Forge-Change
  # Forge-Change-End
  startingGear: VaultDwellerGear
  alwaysUseSpawner: true
  icon: "JobIconVaulDweller" # Forge-Change
  supervisors: job-supervisors-vault
  access:
  - VaultDweller
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - Vault

- type: startingGear
  id: VaultDwellerGear
  equipment:
    jumpsuit: N14ClothingUniformJumpsuitVault14
    back: N14ClothingBackpackVaultBlue # Forge-Change
    shoes: N14ClothingBootsBlack
    id: N14VaultPDA
    ears: N14ClothingHeadsetVaultDweller
  innerClothingSkirt: N14ClothingUniformJumpsuitVault14
  storage: # Forge-Change
    back:
    - N14CleanGauze10
    - N14CurrencyPrewarMoney100

- type: playTimeTracker
  id: VaultDweller
