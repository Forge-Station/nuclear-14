- type: entity
  save: false # Forge-Add
  abstract: true
  # parent: MobSiliconBase # Forge-Delete
  id: N14MobRobot
  categories: [ HideSpawnMenu ] # Forge-Add
  # suffix: hostile npc # Forge-Delete
  # name: robot # Forge-Delete
  # description: Designed to serve humankind. Maybe it ended it. # Forge-Delete
  components:
  # Forge-Add-Start
  - type: LagCompensation
  - type: Reactive
    groups:
      Acidic: [Touch]
  - type: Clickable
  - type: InteractionOutline
  - type: StatusEffects
    allowed:
    - Stun
    - KnockedDown
    - SlowedDown
    - Stutter
    - Electrocution
  - type: MovedByPressure
  # Forge-Add-End
  # Forge-Change-Start
  - type: Damageable
    damageContainer: Inorganic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.4
        density: 150
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Input
    context: "human"
  - type: InputMover
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 6
  - type: Sprite
    noRot: true
    drawdepth: Mobs
  - type: Physics
    bodyType: KinematicController
  - type: NameIdentifier
    group: GenericNumber
  - type: Pullable
  - type: MobState
    allowedStates:
      - Alive
      - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
    showOverlays: false
  - type: Stamina
    critThreshold: 20
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: MobMover
  - type: Body
    prototype: Bot
  - type: CombatMode
  # Forge-Change-End
# TODO: Make them shout things at people using advertise.

# Forge-Change-Start
- type: entity
  parent: N14MobRobot
  id: N14MobRobotHostile
  categories: [ HideSpawnMenu ]
  suffix: hostile npc
  name: robot
  description: Designed to serve humankind. Maybe it ended it.
  components:
  - type: NpcFactionMember
    factions:
    - HostileRobot
  - type: HTN
    rootTask:
      task: N14HostileCompound
  - type: MovementAlwaysTouching
  - type: Appearance
  - type: ReplacementAccent
    accent: genericAggressive
  - type: SpriteMovement
    movementLayers:
      movement:
        state: moving
    noMovementLayers:
      movement:
        state: icon
  - type: DamageStateVisuals
    states:
      Alive:
        Base: icon
      Dead:
        Base: dead
  # - type: Bloodstream
    # bloodMaxVolume: 50
  # - type: GhostTakeoverAvailable
  # - type: GhostRole
    # prob: 0.33
    # makeSentient: true
    # name: hostile attacker # wave defence
    # description: |
      # Wreak havoc and kill all humans!
# Forge-Change-End

- type: entity
  abstract: true
  parent: N14MobRobotHostile
  id: N14MobRobotHostileMelee
  categories: [ HideSpawnMenu ]
  components:
  - type: MeleeWeapon
    hidden: true
    soundHit:
        path: /Audio/Effects/metal_thud1.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      groups:
        Brute: 5
# Forge-Add-Start
  - type: HTN
    rootTask:
      task: N14RangedHostileCompound
    blackboard:
      NavClimb: !type:Bool
        true

- type: entity
  abstract: true
  parent: N14MobRobotHostile
  id: N14MobRobotHostileRanged
  categories: [ HideSpawnMenu ]
  components:
  - type: HTN
    rootTask:
      task: N14RangedHostileCompound
  - type: Gun #Mobs currently cannot bolt a gun, so we have to simulate them firing it
    minAngle: 9
    maxAngle: 18
    angleIncrease: 3
    angleDecay: 4
    fireRate: 1
    soundGunshot:
      collection: N14RechargerRifleGunshot
    useKey: false
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
  - type: BasicEntityAmmoProvider
    proto: BulletLaser
    capacity: 9
    count: 9
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 2
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
# Forge-Add-End

