- type: entity
  id: N14CartridgeNail
  name: cartridge nail
  parent: BaseCartridgePistol
  components:
  - type: CartridgeAmmo
    proto: N14CartridgeNail
    soundEject:
      collection: N14PistolCasingEject
  - type: Sprite
    sprite: Resources/Textures/Corvax/Objects/Weapons/Guns/Ammunition/Casings/nail_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: Tag
    tags:
      - Cartridge
      - N14CartridgeNail
  - type: EmitSoundOnLand
    sound:
      collection: N14PistolCasingEject
      params:
        volume: -1
  - type: EmitSoundOnCollide
    sound:
      collection: N14PistolCasingEject
      params:
        volume: -1
