- type: entity
  name: Nail SMG
  parent: N14WeaponSMGBase
  id: N14WeaponSMGNAil
  description: A pre-war submachine gun with a wooden stock, chambered in .45.
  components:
  - type: Clothing
    sprite: _Nuclear14/Objects/Weapons/Guns/SMGs/NailSMG.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Item # Forge-Change
    size: Large
    shape:
    - 0,0,2,1
    - 0,1,0,1
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Guns/SMGs/NailSMG.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    fireRate: 7
    soundGunshot:
      collection: N1445SMGGunshot
    selectedMode: Fullauto
    availableModes:
    - Fullauto
    minAngle: 8
    maxAngle: 20
    angleIncrease: 4
    angleDecay: 16
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/_Nuclear14/Weapons/Effects/Reload/SMGs/smg_cock.ogg
  - type: GunWieldBonus
    minAngle: -7
    maxAngle: -15
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine45SubMachineGun
        insertSound: /Audio/_Nuclear14/Weapons/Effects/Reload/SMGs/smg_magin.ogg
        ejectSound: /Audio/_Nuclear14/Weapons/Effects/Reload/SMGs/smg_magout.ogg
        whitelist:
          tags:
            - DrumMagazineNailGun
      gun_chamber:
        name: Chamber
        startingItem: N14CartridgeNail
        priority: 1
        whitelist:
          tags:
            - N14CartridgeNail
