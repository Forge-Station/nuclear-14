#MARK: Пила.
- type: entity
  name: ripper
  parent: N14Machete
  id: N14ripper
  description: A light one-handed chainsaw originally designed for the pre-war army sappers to clean selvatic and wooded paths, it also works well against flesh.
  components:
  - type: Item
    size: Normal #Corvax-Change
    sprite: _Nuclear14/Objects/Weapons/Melee/ripper.rsi
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Melee/ripper.rsi
    state: icon
  - type: Clothing
    sprite: _Nuclear14/Objects/Weapons/Melee/ripper.rsi
    quickEquip: false
    slots:
    - Belt
    - suitStorage
  - type: EmbeddableProjectile
    sound: /Audio/_Nuclear14/Weapons/Melee/Swing/ripper.ogg
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 15
        Slash: 25
    attackRate: 1
    heavyRateModifier: 1.2
    heavyRangeModifier: 1.2
    heavyDamageBaseModifier: 1
    heavyStaminaCost: 10
    maxTargets: 1
    angle: 90
  - type: EmbedPassiveDamage
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 25
        Slash: 35
    soundHit:
      path: /Audio/_Nuclear14/Weapons/Melee/Swing/ripper.ogg
  - type: SolutionContainerManager
    solutions:
      melee:
        maxVol: 6
        reagents:
        - ReagentId: Razorium
          Quantity: 6
  - type: SolutionRegeneration
    solution: melee
    generated:
      reagents:
      - ReagentId: Razorium
        Quantity: 6
  - type: MeleeChemicalInjector
    solution: melee
    transferAmount: 6
  - type: Sharp
  - type: DisarmMalus
  - type: UseDelay
    delay: 1
  - type: Tool
    qualities:
      - Sawing
    speedModifier: 3.0
  - type: StaticPrice
    price: 50
  - type: SurgeryTool
    startSound:
      path: /Audio/Medical/Surgery/saw.ogg
  - type: BoneSaw
    speed: 0.75
  - type: Scalpel
    speed: 0.5