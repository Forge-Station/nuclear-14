#MARK: Мачете
- type: entity
  name: machete
  parent: Machete
  id: N14Machete
  description: A large, vicious looking blade.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Melee/machete.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: _Nuclear14/Objects/Weapons/Melee/machete.rsi
  - type: Clothing
    sprite: _Nuclear14/Objects/Weapons/Melee/machete.rsi
    quickEquip: false
    slots:
    - Belt
    - suitStorage
  - type: MeleeWeapon
    damage:
      types:
        Slash: 40
    wideAnimationRotation: -135
    attackRate: 0.8
    heavyRateModifier: 0.8
    heavyRangeModifier: 1.2
    heavyDamageBaseModifier: 0.8
    heavyStaminaCost: 5
    range: 1.2
    angle: 60
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 35
    soundHit:
      collection: N14BladeMediumSwing
  - type: Sharp
  - type: Execution
    doAfterDuration: 4.0
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: EmbedPassiveDamage
  - type: Utensil
    types:
      - Knife
  - type: StaticPrice
    price: 30

- type: entity
  name: tribal sword
  parent: N14Machete
