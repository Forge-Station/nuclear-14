- type: entity
  name: axe
  parent: BaseItem
  id: N14BaseAxe
  description: A heavy wood axe, classic tool and weapon.
  components:
  - type: Tag
    tags:
    - FireAxe
  - type: Item
    size: Large
  - type: Clothing
    sprite: _Nuclear14/Objects/Weapons/Melee/axe.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Melee/axe.rsi
    state: icon
  - type: Wieldable
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.1
    heavyRateModifier: 1.1
    heavyRangeModifier: 1.4
    heavyDamageBaseModifier: 1.4
    heavyStaminaCost: 15
    range: 1.4
    angle: 60
    damage:
      types:
        Blunt: 10
        Slash: 5
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 20
        Slash: 25
  - type: Sharp
  - type: StaticPrice
    price: 30

- type: entity
  name: fireaxe
  parent: N14BaseAxe
  id: N14FireAxe
  description: Truly the weapon of a madman. Who would think to fight fire with an axe?
  components:
  - type: Item
    size: Large
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Melee/fireaxe.rsi
    state: icon
  - type: Clothing
    sprite: _Nuclear14/Objects/Weapons/Melee/fireaxe.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.2
    heavyRateModifier: 1.2
    heavyRangeModifier: 1.4
    heavyDamageBaseModifier: 1.5
    heavyStaminaCost: 20
    range: 1.4
    angle: 60
    soundHit:
      collection: MetalThud
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 20
        Slash: 35
  - type: Tool
    qualities:
      - Prying
      - Axing
  - type: ToolTileCompatible
  - type: Prying
  - type: StaticPrice
    price: 30
