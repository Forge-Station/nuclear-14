- type: entity
  name: hatchet
  parent: BaseItem
  id: N14Hatchet
  description: A tool that's just as useful as a weapon. Used for chopping things.
  components:
  - type: Tag
    tags:
    - BotanyHatchet
    - Axe
  - type: Item
    sprite: _Nuclear14/Objects/Weapons/Melee/hatchet.rsi
    size: Normal
  - type: Clothing
    sprite: _Nuclear14/Objects/Weapons/Melee/hatchet.rsi
    slots:
    - Belt
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Melee/hatchet.rsi
    state: icon
    netsync: false
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.8
    heavyRateModifier: 0.8
    heavyRangeModifier: 1
    heavyDamageBaseModifier: 0.9
    heavyStaminaCost: 5
    range: 1
    angle: 60
    damage:
      types:
        Slash: 20
        Piercing: 10
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 30
        Piercing: 15
  - type: Sharp
  - type: UseDelay
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: StaticPrice
    price: 20

