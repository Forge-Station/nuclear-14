- type: entity
  name: sledge hammer
  parent: BaseItem
  id: N14SledgeHammer
  description: A robust sledge hammer that requires considerable strength to be wielded.
  components:
  - type: Item
    size: Large
  - type: Clothing
    sprite: _Nuclear14/Objects/Weapons/Melee/sledgehammer.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Melee/sledgehammer.rsi
    state: icon
  - type: Wieldable
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 30
    wideAnimationRotation: -135
    attackRate: 1.2
    heavyRateModifier: 1.4
    heavyRangeModifier: 1.4
    heavyDamageBaseModifier: 1.2
    heavyStaminaCost: 20
    range: 1.4
    angle: 60
  - type: StaminaDamageOnHit
    damage: 10
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 20
        Structural: 25
  - type: MeleeThrowOnHit
    speed: 5
    lifetime: 0.025
  # - type: Tool
    # qualities:
      # - Crushing
    # useSound:
      # path: /Audio/Items/eating_2.ogg # TODO: Crushing noise
  - type: StaticPrice
    price: 60

