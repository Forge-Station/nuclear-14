- type: entity
  name: roll of gauze
  id: N14DirtyGauze10
  description: Some dirty gauze to wrap around bloody wounds, might not be the best for your long-term health.
  parent: N14BaseHealingItem
  suffix: Stack
  components:
  - type: Tag
    tags:
    - N14DirtyGauze
    - Gauze
  - type: Appearance
  - type: Sprite #Forge-change
    scale: 0.7, 0.7
    sprite: _Nuclear14/Objects/Specific/Medical/ms13_medical.rsi
    layers:
    - state: gauze_diy1
      map: ["base"]
  - type: Stack
    stackType: N14DirtyGauze10
    count: 10
    baseLayer: base
    layerStates:
    - gauze_diy1
    - gauze_diy2
    - gauze_diy3
  - type: Healing
    damageContainers:
      - Biological
    damage:
      types:
        Slash: -7
        Piercing: -7
        Poison: 1
    bloodlossModifier: -7
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
  - type: StackPrice
    price: 2 # Forge-Change
  - type: Butcherable
    butcheringType: Knife
    spawned:
