# Blueprint item entities for the tiered faction crafting system.
# Players find these in the world and place them in workbenches to unlock
# faction-specific recipes. Each blueprint is tied to a faction, tier, and
# workbench type (Weapons/Armor).

# Abstract parent for all blueprint items
- type: entity
  parent: BaseItem
  id: N14BlueprintBase
  abstract: true
  name: чертёж
  description: Довоенный чертёж, содержащий производственные схемы.
  components:
  - type: Sprite
    sprite: _Forge/Objects/Misc/blueprint.rsi
    state: blueprint
  - type: Item
    size: Tiny
    shape:
    - 0,0,1,0
  - type: Tag
    tags:
    - Document
  - type: Blueprint
    recipes: []
  - type: EmitSoundOnPickup
    sound: /Audio/SimpleStation14/Items/Handling/paper_pickup.ogg
  - type: EmitSoundOnDrop
    sound: /Audio/SimpleStation14/Items/Handling/paper_drop.ogg
  - type: EmitSoundOnLand
    sound: /Audio/SimpleStation14/Items/Handling/paper_drop.ogg

