- type: entity
  parent: BaseItem
  id: N14FactionResearchDiskBase
  name: faction research disk
  description: A data disk holding faction research points. Convert it at a faction research bench.
  components:
  - type: Sprite
    scale: 0.8, 0.8
    sprite: Objects/Specific/Research/researchdisk.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: FactionResearchValue
    pointsOverride: 500
  - type: EmitSoundOnPickup
    sound: /Audio/SimpleStation14/Items/Handling/disk_pickup.ogg
  - type: EmitSoundOnDrop
    sound: /Audio/SimpleStation14/Items/Handling/disk_drop.ogg
  - type: EmitSoundOnLand
    sound: /Audio/SimpleStation14/Items/Handling/disk_drop.ogg

- type: entity
  parent: N14FactionResearchDiskBase
  id: N14FactionResearchDisk500
  name: диск исследования (500)
