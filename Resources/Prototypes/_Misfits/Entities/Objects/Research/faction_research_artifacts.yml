- type: entity
  parent: BaseItem
  id: N14ResearchArtifactBase
  abstract: true
  name: research artifact
  description: A piece of salvageable tech. Convert it at a faction research bench for research points.
  components:
  - type: Item
    size: Normal
  - type: StaticPrice
    price: 1000
  - type: PointLight
    radius: 1.4
    energy: 2
    color: "#ffd9a3"
