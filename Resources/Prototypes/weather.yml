# Forge-Change-Del # - type: weather
# Forge-Change-Del #   id: Ashfall
# Forge-Change-Del #   sprite:
# Forge-Change-Del #     sprite: /Textures/Effects/weather.rsi
# Forge-Change-Del #     state: ashfall
# Forge-Change-Del #   sound:
# Forge-Change-Del #     path: /Audio/Effects/Weather/snowstorm_weak.ogg
# Forge-Change-Del #     params:
# Forge-Change-Del #       loop: true
# Forge-Change-Del #       volume: -6
# Forge-Change-Del #   temperature: 330
# Forge-Change-Del #   duration: 500
# Forge-Change-Del #   message: weather-ashfall
# Forge-Change-Start
- type: weather
  id: Ashfall
  sprite:
    sprite: /Textures/Effects/weather.rsi
    state: ashfall
  sound:
    path: /Audio/Effects/Weather/snowstorm_weak.ogg
    params:
      loop: true
      volume: -6
  temperature: 330
  duration: 500
  chance: 1
  visibilityClearRadius: 5
  visibilityClearBuffer: 2
  message: weather-ashfall
# Forge-Change-End

