#! Corvax-Change

# Forge-Change-Start
- type: weather
  id: Ashfall
  sprite:
    sprite: /Textures/Effects/weather.rsi
    state: ashfall
  sound:
    path: /Audio/Effects/Weather/snowstorm_weak.ogg
    params:
      loop: true
      volume: -6
  temperature: 330
  duration: 500
  chance: 1
  visibilityClearRadius: 5
  visibilityClearBuffer: 2
  message: weather-ashfall
# Forge-Change-End

