- type: weather
  id: NCRadioactiveParticles
  sprite:
    sprite: /Textures/Effects/weather.rsi
    state: fallout
  sound:
    collection: NCRadioactiveParticles
    params:
      loop: true
      volume: -6
  # Forge-Change-Del duration: 150
  # Forge-Change
  duration: 180
  radioactive: true
  # Forge-Change-Del rads: 1.25
  # Forge-Change
  rads: 1
  showMessage: true
  # Forge-Change-Del chance: 2
  # Forge-Change
  chance: 1
  sender: weather-announcement
  message: weather-radioactive-particles

