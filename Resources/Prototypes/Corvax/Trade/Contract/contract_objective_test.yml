# Test contracts for all supported execution modes.
#
# Delivery has two distinct scenarios:
# 1. Classic inventory delivery:
#    objectiveType: Delivery
#    no runtime.targetPrototype
#    Any matching item can be handed in.
#
# 2. Tracked delivery objective:
#    objectiveType: Delivery
#    runtime.targetPrototype is set
#    The spawned target entity must be delivered exactly.

- type: storeContractPack
  id: PackBazarObjectiveTest
  contracts:
  - id: caravan_contract_test_delivery_inventory_ingot
    weight: 100
  - id: caravan_contract_test_delivery_tracked_ingot
    weight: 100
  - id: caravan_contract_test_hunt_monkey
    weight: 100
  - id: caravan_contract_test_repair_table
    weight: 100
  - id: caravan_contract_test_ghost_role_hamlet
    weight: 100

- type: storeContractsPreset
  id: PresetBazarObjectiveTest
  limits:
    Easy: 5
  packs:
  - id: PackBazarObjectiveTest
    weight: 1

# ----------------------------
# Classic inventory delivery
# ----------------------------
- type: storeContract
  id: caravan_contract_test_delivery_inventory_ingot
  name: "Тест: обычная поставка медного слитка"
  description: "Классическая поставка с подсказочным спавном. Автомат создаст медный слиток в мире, но сдать можно любой подходящий слиток."
  difficulty: Easy
  repeatable: true
  objectiveType: Delivery
  runtime:
    spawnPointTag: NcContractDeliveryTestSpawn
    deliverySpawnPrototype: N14IngotCopper1
  targets:
  - id: N14IngotCopper1
    required: 1
  rewards:
  - type: Currency
    id: Caps
    amount: { min: 20, max: 35 }

# ----------------------------
# Tracked delivery objective
# ----------------------------
- type: storeContract
  id: caravan_contract_test_delivery_tracked_ingot
  name: "Тест: адресная доставка медного слитка"
  description: "Objective-поставка со спавном цели. Найдите отмеченный слиток и сдайте именно его через автомат. Любой другой такой же предмет не подойдёт."
  difficulty: Easy
  repeatable: true
  objectiveType: Delivery
  runtime:
    spawnPointTag: NcContractDeliveryTestSpawn
    targetPrototype: N14IngotCopper1
    guardPrototype: N14MobRaiderPsycho
    guardCount: 2
    givePinpointer: true
    pinpointerPrototype: PinpointerUniversal
  targets:
  - id: N14IngotCopper1
    required: 1
  rewards:
  - type: Currency
    id: Caps
    amount: { min: 35, max: 60 }

# ----------------------------
# Hunt objective
# ----------------------------
- type: storeContract
  id: caravan_contract_test_hunt_monkey
  name: "Тест: охота на обезьяну"
  description: "Примите контракт, устраните заспавненную цель и сдайте контракт через автомат."
  difficulty: Easy
  repeatable: true
  objectiveType: Hunt
  runtime:
    stageGoal: 1
    spawnPointTag: NcContractHuntTestSpawn
    targetPrototype: MobMonkey
    guardPrototype: N14MobRaiderPsycho
    guardCount: 2
    givePinpointer: true
    pinpointerPrototype: PinpointerUniversal
  rewards:
  - type: Currency
    id: Caps
    amount: { min: 50, max: 80 }

# ----------------------------
# Multi-stage repair objective
# ----------------------------
- type: storeContract
  id: caravan_contract_test_repair_table
  name: "Тест: ремонт стола"
  description: "Почините заспавненный объект сваркой три раза. После каждого этапа появляется новая волна охраны."
  difficulty: Easy
  repeatable: true
  objectiveType: Repair
  runtime:
    stageGoal: 3
    spawnPointTag: NcContractRepairTestSpawn
    structurePrototype: Table
    guardPrototype: N14MobRaiderPsycho
    guardCount: 2
    givePinpointer: true
    pinpointerPrototype: PinpointerUniversal
    repairToolQuality: Welding
    repairDoAfterSeconds: 2
    repairStageSound: /Audio/Effects/sparks4.ogg
  rewards:
  - type: Currency
    id: Caps
    amount: { min: 80, max: 120 }

# ----------------------------
# Ghost-role objective
# ----------------------------
- type: storeContract
  id: caravan_contract_test_ghost_role_hamlet
  name: "Тест: гост-роль рейдера"
  description: "Примите контракт, дождитесь заселения гост-роли, устраните цель и доставьте тело к торговому автомату."
  difficulty: Easy
  repeatable: true
  objectiveType: GhostRole
  runtime:
    stageGoal: 1
    spawnPointTag: NcContractGhostRoleTestSpawn
    ghostRolePrototype: N14MobHumanRaider
    guardPrototype: N14MobRaiderPsycho
    guardCount: 2
    givePinpointer: true
    pinpointerPrototype: PinpointerUniversal
    acceptTimeoutSeconds: 60
  rewards:
  - type: Currency
    id: Caps
    amount: { min: 90, max: 140 }
