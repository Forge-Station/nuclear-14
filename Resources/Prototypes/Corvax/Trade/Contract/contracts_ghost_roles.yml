- type: ncGhostRoleContract
  id: NcGhostRoleContractRaiderReturn
  name: "Рейдер для допроса"
  description: "Один рейдер слишком много знает о ближайших налётах. Заказчик хочет допросить его лично: поймайте цель живой, без тяжёлых ран, закуйте в наручники и приведите к торговцу."
  repeatable: false
  role: NcGhostRoleRaider
  completion:
    mode: AliveCuffedTurnIn
  survival:
    briefing: "За вами охотятся по контракту. Продержитесь один час и не дайте охотникам сдать вас торговцу."
    objectiveTitle: "Выжить один час"
    objectiveDescription: "Если вы проживёте час после принятия роли, контракт против вас будет провален."
  spawn:
    point:
      type: MarkerId
      id: TradeContractGhostRaiderReturnSpawn
    acceptTimeoutSeconds: 300
  reward:
  - type: Currency
    currency: Caps
    count: { min: 700, max: 1000 }
  - type: Pool
    pool: caravan_medium
    count: { min: 2, max: 5 }

