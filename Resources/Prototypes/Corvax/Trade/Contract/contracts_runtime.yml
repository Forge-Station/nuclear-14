

- type: entity
  id: TradeContractDropoffSign
  name: караванная веха приёмки
  description: Временный знак караванной приёмки. Оставьте отмеченный груз рядом; после подтверждения веху уберут.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Objects/Decoration/mines.rsi
    state: sign_right
  - type: PointLight
    enabled: true
    radius: 2
    energy: 0.8
    color: "#C9A45A"

# Empty Retrieval cargo prototypes.
# These are intentionally separate from loot/fill crates: contract cargo should not
# give free supplies, and destroying this cargo makes the contract fail.

- type: entity
  parent: N14CrateWooden
  id: NcTradeCargoWoodenCrate
  name: меченый деревянный ящик
  description: Деревянный ящик с караванной пломбой. Его надо доставить целым; содержимое не важно, важен сам груз.
  categories: [ HideSpawnMenu ]

- type: entity
  parent: N14CrateMedical
  id: NcTradeCargoMedicalCrate
  name: меченый медицинский ящик
  description: Медицинский ящик с караванной пломбой. Его приняли как груз, а не как источник бесплатных медикаментов.
  categories: [ HideSpawnMenu ]

- type: entity
  parent: N14CrateAluminium
  id: NcTradeCargoPartsCrate
  name: меченый ящик с деталями
  description: Алюминиевый ящик с караванной пломбой. Его ждут в мастерской или ремонтной точке.
  categories: [ HideSpawnMenu ]

- type: entity
  parent: N14CrateMilitary
  id: NcTradeCargoAmmoCrate
  name: меченый ящик боеприпасов
  description: Закрытый военный ящик с караванной пломбой. Это груз для доставки, а не бесплатный склад патронов.
  categories: [ HideSpawnMenu ]

- type: entity
  parent: N14CrateWooden
  id: NcTradeCargoProvisionCrate
  name: караванный ящик провизии
  description: Пустой деревянный ящик с биркой каравана. Используется как груз для доставки еды и припасов.
  categories: [ HideSpawnMenu ]

# -----------------------------------------------------------------------------
# Light city Retrieval routes for mapper-placed marker pools
# -----------------------------------------------------------------------------

- type: ncRetrievalSourcePreset
  id: BazarLightSourceCityGateCargo
  spawnCargo: true
  point:
    type: MarkerId
    id: TradeContractLightCityGateCargoSource

- type: ncRetrievalSourcePreset
  id: BazarLightSourceOutsideCargo
  spawnCargo: true
  point:
    type: MarkerId
    id: TradeContractLightOutsideCargoSource

- type: ncRetrievalSourcePreset
  id: BazarLightSourceClinicMeds
  spawnCargo: true
  point:
    type: MarkerId
    id: TradeContractLightClinicMedsSource

- type: ncRetrievalSourcePreset
  id: BazarLightSourceWorkshopParts
  spawnCargo: true
  point:
    type: MarkerId
    id: TradeContractLightWorkshopPartsSource

- type: ncRetrievalDestinationPreset
  id: BazarLightDestinationStoreUi
  target:
    type: StoreUi

- type: ncRetrievalDestinationPreset
  id: BazarLightDestinationOutsideDropoff
  target:
    type: MarkerGroup
    id: TradeContractLightOutsideDropoff
  radius: 2.0

- type: ncRetrievalDestinationPreset
  id: BazarLightDestinationClinicDropoff
  target:
    type: MarkerGroup
    id: TradeContractLightClinicDropoff
  radius: 2.0

- type: ncRetrievalDestinationPreset
  id: BazarLightDestinationWorkshopDropoff
  target:
    type: MarkerGroup
    id: TradeContractLightWorkshopDropoff
  radius: 2.0

- type: ncRetrievalGuidancePreset
  id: BazarLightGuidanceOutsideToTrader
  sourceHint: "дорожный груз за городом"
  destinationHint: "торговец принимает сам ящик"
  pinpointer:
    enabled: true
    target: CargoThenDestinationThenStore
    prototype: PinpointerUniversal
    maxActive: 7

- type: ncRetrievalGuidancePreset
  id: BazarLightGuidanceGateToOutside
  sourceHint: "городские ворота"
  destinationHint: "ближайший пост за городом"
  pinpointer:
    enabled: true
    target: CargoThenDestinationThenStore
    prototype: PinpointerUniversal
    maxActive: 7

- type: ncRetrievalGuidancePreset
  id: BazarLightGuidanceWarehouseToClinic
  sourceHint: "малый склад или подсобка"
  destinationHint: "медпункт"
  pinpointer:
    enabled: true
    target: CargoThenDestinationThenStore
    prototype: PinpointerUniversal
    maxActive: 7

- type: ncRetrievalGuidancePreset
  id: BazarLightGuidanceWarehouseToWorkshop
  sourceHint: "кладовая у мастерской"
  destinationHint: "мастерская или гараж"
  pinpointer:
    enabled: true
    target: CargoThenDestinationThenStore
    prototype: PinpointerUniversal
    maxActive: 7

- type: ncRetrievalRoutePreset
  id: BazarLightRouteOutsideToTrader
  source: BazarLightSourceOutsideCargo
  destination: BazarLightDestinationStoreUi
  claim:
    mode: StoreCargo
  guidance: BazarLightGuidanceOutsideToTrader
  delivery:
    consumeCargo: true
    lockDeliveredCargo: false

- type: ncRetrievalRoutePreset
  id: BazarLightRouteGateToOutsideProof
  source: BazarLightSourceCityGateCargo
  destination: BazarLightDestinationOutsideDropoff
  claim:
    mode: DestinationProof
    proof: BazarDeliveryReceiptProof
  guidance: BazarLightGuidanceGateToOutside
  delivery:
    consumeCargo: true
    lockDeliveredCargo: false

- type: ncRetrievalRoutePreset
  id: BazarLightRouteWarehouseToClinicProof
  source: BazarLightSourceClinicMeds
  destination: BazarLightDestinationClinicDropoff
  claim:
    mode: DestinationProof
    proof: BazarDeliveryReceiptProof
  guidance: BazarLightGuidanceWarehouseToClinic
  delivery:
    consumeCargo: true
    lockDeliveredCargo: false

- type: ncRetrievalRoutePreset
  id: BazarLightRouteWarehouseToWorkshopProof
  source: BazarLightSourceWorkshopParts
  destination: BazarLightDestinationWorkshopDropoff
  claim:
    mode: DestinationProof
    proof: BazarDeliveryReceiptProof
  guidance: BazarLightGuidanceWarehouseToWorkshop
  delivery:
    consumeCargo: true
    lockDeliveredCargo: false

