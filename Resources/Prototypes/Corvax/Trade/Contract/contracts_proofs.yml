# Proof preset used by marker-based DeliveryProof routes.
# Bearer means whoever physically brings this paper back to the trader may claim the reward.
- type: ncRetrievalProofPreset
  id: BazarDeliveryReceiptProof
  prototype: NcTradeContractProofDeliveryReceipt
  ownership: Bearer
  reissue: Never
  consumeOnRewardClaim: true

