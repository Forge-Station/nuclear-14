# Shared contract ghost-role definitions.

- type: ncGhostRolePreset
  id: NcGhostRoleRaider
  entityPrototype: N14MobHumanRaider
  name: nc-contract-ghost-role-raider-name
  description: nc-contract-ghost-role-raider-description
  rules: nc-contract-ghost-role-raider-rules
  requirements:
  - !type:CharacterOverallTimeRequirement
    min: 36000 # 10 hours

- type: startingGear
  id: NcGhostRoleEscapedWorkerGear
  equipment:
    jumpsuit: ClothingUniformDressRed
    shoes: ClothingShoesColorBlack
    back: ClothingBackpackSatchel
    suitstorage: N14WeaponSMG9mm
  storage:
    back:
    - N14MagazineSMG9mm
    - N14MagazineSMG9mm
    - N14MagazineSMG9mm

- type: entity
  parent: MobHuman
  id: NcGhostRoleMobEscapedWorker
  name: беглянка из салуна
  components:
  - type: RandomHumanoidAppearance
    randomizeName: true
  - type: Loadout
    prototypes: [NcGhostRoleEscapedWorkerGear]
  - type: NpcFactionMember
    factions:
    - Wastelander

- type: ncGhostRolePerk
  id: NcGhostRolePerkEscapedWorker
  name: "Панический рывок"
  description: "Беглянка быстрее срывается в бег и опаснее стреляет из пистолетов-пулеметов."
  sprintSpeedMultiplier: 1.30
  projectileDamageMultiplier: 1.30
  weaponPrototypes:
  - N14WeaponSMG9mm
  - N14WeaponSMG9mminfiltrator
  - N14WeaponSMG9mmCanadian
  - N14WeaponSMG10mm
  - N14WeaponSMG10mmSuppressed
  - N14WeaponSMG10mmPipe
  - N14WeaponSMG10mmChinese
  - N14WeaponSMG12mm
  - N14WeaponSMG12mmPipe
  - N14WeaponSMG12mmAdvanced
  - N14WeaponSMG12mmAdvancedChinese
  - N14WeaponSMG12mmAdvancedCanadian
  - N14WeaponSMG45

- type: ncGhostRolePreset
  id: NcGhostRoleEscapedWorker
  entityPrototype: NcGhostRoleMobEscapedWorker
  name: "Беглянка из салуна"
  description: "Вас разыскивают по контракту. Охотники получат награду только если доставят вас живой, полностью здоровой и в наручниках."
  rules: "Вы можете скрываться, договариваться или отбиваться, но ваша цель — пережить один час и не быть сданной торговцу."
  character:
    name: "Рыжая Мэгги"
    sex: Female
    gender: Female
    age: 25
    hair: ZetaHairLongSpikehair
    hairColor: "#B94A24"
  perks:
  - NcGhostRolePerkEscapedWorker

- type: startingGear
  id: NcGhostRoleNCRDeserterGear
  equipment:
    back: N14ClothingBackpackNCR
    gloves: N14ClothingHandsGlovesCombat
    jumpsuit: N14ClothingOfficerUniformNCRDesert
    shoes: N14ClothingBootsCombatFilled
    neck: N14ClothingNeckMantleNCR
    belt: ClothingBeltNCR
    outerClothing: N14ClothingOuterNCRCombatArmor
    suitstorage: N14WeaponRifle556Service
    pocket1: NCRSGTloadoutkits
    pocket2: RadioHandheld
    id: N14IDNCRDogtagNCO
  storage:
    back:
    - Magazine556Rifle
    - Magazine556Rifle
    - N14BoxPlasticFilledMilitaryNCR

- type: entity
  parent: MobHuman
  id: NcGhostRoleMobNCRDeserter
  name: дезертир НКР
  components:
  - type: RandomHumanoidAppearance
    randomizeName: true
  - type: Loadout
    prototypes: [NcGhostRoleNCRDeserterGear]
  - type: NpcFactionMember
    factions:
    - Wastelander
    - NCR

- type: ncGhostRolePerk
  id: NcGhostRolePerkNCRDeserter
  name: "Сержантская выучка"
  description: "Дезертир лучше держит строй под огнем и наносит больше урона из служебных винтовок."
  projectileDamageMultiplier: 1.40
  weaponPrototypes:
  - N14WeaponRifle556Service
  - N14WeaponRifle556ServiceScoped
  - N14WeaponRifle556Carbine
  - N14WeaponRifle556CarbineOld
  - N14WeaponRifle556R91
  - N14WeaponRifle762M14
  - N14WeaponRifle762Marksman
  incomingFlatReductions:
    Slash: 5
    Piercing: 5
    Heat: 5

- type: ncGhostRolePreset
  id: NcGhostRoleNCRDeserter
  entityPrototype: NcGhostRoleMobNCRDeserter
  name: "Патроу, дезертир НКР"
  description: "Вы дезертир НКР с хорошей броней и винтовкой. Охотники получат награду только если доставят ваше тело торговцу."
  rules: "Скройтесь, отстреливайтесь или попытайтесь переждать час. Если выживете, контракт против вас будет провален."
  character:
    name: "Патроу"
    sex: Male
    gender: Male
    age: 34
  perks:
  - NcGhostRolePerkNCRDeserter

- type: startingGear
  id: NcGhostRoleFreshGear
  equipment:
    jumpsuit: N14ClothingUniformJumpsuitRags
    shoes: N14ClothingShoesRaider
    back: ClothingBackpackSatchel
    suitstorage: N14WeaponSMG10mmPipe
  storage:
    back:
    - N14MagazineSMG10mm
    - N14MagazineSMG10mm

- type: entity
  parent: MobHuman
  id: NcGhostRoleMobFresh
  name: фреш
  components:
  - type: RandomHumanoidAppearance
    randomizeName: true
  - type: Loadout
    prototypes: [NcGhostRoleFreshGear]
  - type: NpcFactionMember
    factions:
    - Wastelander
    - Raider

- type: ncGhostRolePerk
  id: NcGhostRolePerkFresh
  name: "Ломка и адреналин"
  description: "Фреш быстрее убегает и предпочитает стрелять, а не лезть в ближний бой."
  sprintSpeedMultiplier: 1.30

- type: ncGhostRolePreset
  id: NcGhostRoleFresh
  entityPrototype: NcGhostRoleMobFresh
  name: "Фреш"
  description: "Вы сорвавшийся наркоман с самодельным пистолетом-пулеметом. Охотники получат награду только если принесут ваше тело торговцу."
  rules: "Держитесь подальше от охотников и переживите один час. Если выживете, контракт против вас будет провален."
  character:
    name: "Фреш"
    sex: Male
    gender: Male
    age: 28
  perks:
  - NcGhostRolePerkFresh

- type: ncGhostRoleContract
  id: NcGhostRoleContractRaiderReturn
  name: "Особый заказ: захват рейдера"
  description: "На связь вышел опасный рейдер. Дождитесь, пока кто-то примет роль, затем доставьте цель живой, здоровой и в наручниках."
  role: NcGhostRoleRaider
  completion:
    mode: AliveCuffedTurnIn
  survival:
    briefing: "Вы цель особого заказа. Продержитесь один час и не дайте охотникам сдать вас торговцу."
    objectiveTitle: "Выжить один час"
    objectiveDescription: "Если вы проживёте час после принятия роли, контракт против вас будет провален."
  spawn:
    point:
      type: MarkerId
      id: TradeContractGhostSpawn
    acceptTimeoutSeconds: 300
  reward:
  - type: Currency
    currency: Caps
    count: 180
  - type: Pool
    pool: caravan_medium
    count: 1

