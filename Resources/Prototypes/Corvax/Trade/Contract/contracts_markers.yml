# Mapper-only contract anchors.
#
# Эти сущности нужны мапперам. Они не добавляют заказы сами по себе,
# а дают стабильные NcContractSpawnPoint id/groups для заказов с живыми точками на карте.
#
# Зелёные маркеры = где появляется груз.
# Синие маркеры = куда груз надо доставить.
# Красные маркеры = где появляются опасные цели/особые роли.

- type: entity
  id: MarkerTradeContractBase
  abstract: true
  parent: MarkerBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Markers/cross.rsi

- type: entity
  id: MarkerTradeContractSpawnBase
  abstract: true
  parent: MarkerTradeContractBase
  components:
  - type: Sprite
    layers:
    - state: green

- type: entity
  id: MarkerTradeContractDestinationBase
  abstract: true
  parent: MarkerTradeContractBase
  components:
  - type: Sprite
    layers:
    - state: blue

- type: entity
  id: MarkerTradeContractDangerBase
  abstract: true
  parent: MarkerTradeContractBase
  components:
  - type: Sprite
    layers:
    - state: red

# -----------------------------------------------------------------------------
# Legacy compatibility anchors
# -----------------------------------------------------------------------------

- type: entity
  id: MarkerTradeContractRoad
  parent: MarkerTradeContractSpawnBase
  name: "контракт: дорожная точка"
  description: "Старый дорожный маркер контрактов. Оставлен для совместимости с уже сохранёнными картами."
  suffix: NC, Contracts, Legacy, Mapper
  components:
  - type: NcContractSpawnPoint
    id: TradeContractRoad
    groups:
    - TradeContractRoad
    - TradeContractLegacy

