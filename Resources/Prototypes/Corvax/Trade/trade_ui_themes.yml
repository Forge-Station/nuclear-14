# UI themes for NcStore.
# Use in entity:
# - type: NcStore
#   uiTheme: TradeUiThemeWasteland

- type: ncStoreUiTheme
  id: TradeUiThemeWasteland
  colors:
    tabsShellBackground: "#17181D"      # Внешний фон рамки всех вкладок
    tabsShellBorder: "#7A6334"          # Внешняя граница рамки вкладок
    tabsFrameBackground: "#1E2027"      # Внутренний фон области вкладок
    tabsFrameBorder: "#4C4438"          # Внутренняя граница области вкладок
    tabContentBackground: "#1E2027"     # Фон контента вкладок (buy/sell/contracts)
    tabsBarBackground: "#1C1E25"        # Фон полосы с кнопками вкладок
    tabsBarBorder: "#665C4E"            # Граница полосы вкладок
    tabActiveBackground: "#6B5730"      # Фон активной вкладки
    tabActiveBorder: "#D4B06A"          # Граница активной вкладки
    tabInactiveBackground: "#2C2E35"    # Фон неактивной вкладки
    tabInactiveBorder: "#665C4E"        # Граница неактивной вкладки
    tabFontActive: "#F0D49A"            # Цвет текста активной вкладки
    tabFontInactive: "#B9AE95"          # Цвет текста неактивной вкладки
    categoriesPanelBackground: "#1A1B20" # Фон левой панели категорий
    categoriesDivider: "#7A6334"        # Вертикальная линия между категориями и списком
    categoryButtonIdle: "#7C6624"       # Фон кнопки категории (обычное состояние)
    categoryButtonSelected: "#D9A441"   # Фон кнопки категории (выбранная)
    headerBackground: "#202329"         # Фон верхней шапки (баланс + поиск)
    headerBorder: "#4C4438"             # Граница верхней шапки
    headerBalanceText: "#FFFF00"        # Цвет числа валюты в шапке
    searchBoxBackground: "#2B2E35"      # Фон поля поиска
    searchBoxBorder: "#4C4438"          # Граница поля поиска
    searchIconColor: "#FFFFFF"          # Цвет иконки лупы
    listingCardBackground: "#141417E6"  # Фон карточки товара справа
    listingCardBorder: "#B08D3B"        # Граница карточки товара
    listingDivider: "#B08D3BCC"         # Линии-разделители внутри карточки товара
    listingTitleColor: "#BFA462"        # Цвет заголовка товара в карточке

