#MARK: Рейдеры племенные
- type: entity
  name: Дикий племенной разведчик
  parent: N14BaseMobRaider
  id: N14MobNPCRaiderTribeSkir
  suffix: Рейдер
  description: Племенной, кто носит огнестрельное оружие, он убьёт любого не из его племени.
  components:
    - type: Gun
      minAngle: 4
      maxAngle: 20
      angleIncrease: 1
      angleDecay: 4
      fireRate: 1
      soundGunshot:
        collection: N14RevolverMagnunGunshot
      useKey: false
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
    - type: BasicEntityAmmoProvider
      proto: N14Cartridge44Magnum
      capacity: 4
      count: 4
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 2
      rechargeSound:
        path: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
    - type: Loadout
      prototypes:
        - TribalSkirmisherNPC
    - type: Sprite
      layers: # Long boring part to make sure layering is correct
      - map: [ "enum.HumanoidVisualLayers.Chest" ]
      - map: [ "enum.HumanoidVisualLayers.Head" ]
      - map: [ "enum.HumanoidVisualLayers.Snout" ]
      - map: [ "enum.HumanoidVisualLayers.Eyes" ]
      - map: [ "enum.HumanoidVisualLayers.Face" ]
      - map: [ "enum.HumanoidVisualLayers.RArm" ]
      - map: [ "enum.HumanoidVisualLayers.LArm" ]
      - map: [ "enum.HumanoidVisualLayers.RLeg" ]
      - map: [ "enum.HumanoidVisualLayers.LLeg" ]
      - shader: StencilClear
        sprite: Mobs/Species/Human/parts.rsi
      - shader: StencilMask
        map: ["enum.HumanoidVisualLayers.StencilMask"]
        sprite: Mobs/Customization/masking_helpers.rsi
        state: unisex_full
        visible: false
      - map: ["jumpsuit"]
      - map: ["enum.HumanoidVisualLayers.LFoot"]
      - map: ["enum.HumanoidVisualLayers.RFoot"]
      - map: ["enum.HumanoidVisualLayers.LHand"]
      - map: ["enum.HumanoidVisualLayers.RHand"]
