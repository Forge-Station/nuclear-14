- type: entity
  id: NcRespawnSpawnerRuntime
  name: runtime respawn spawner
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: RespawnSpawner
    proto: N14RockGreyMining
    spawnOnMapInit: false

- type: entity
  parent: MarkerBase
  id: NcRespawnSpawnerMarkerBase
  abstract: true
  components:
  - type: RespawnSpawnerMarker
    runtimePrototype: NcRespawnSpawnerRuntime
  - type: Sprite
    layers:
    - state: red
      scale: 0.5, 0.5


- type: entity
  parent: NcRespawnSpawnerMarkerBase
  id: SpawnerOreIron
  name: spawner ore iron
  components:
  - type: Sprite
    layers:
    - sprite: DeltaV/Structures/Walls/asteroid_rock.rsi
      state: full
    - sprite: Markers/cross.rsi
      state: red
      scale: 0.5, 0.5
  - type: RespawnSpawner
    proto: N14RockGreyMining
    respawnSeconds: 5
    spawnOnMapInit: true
