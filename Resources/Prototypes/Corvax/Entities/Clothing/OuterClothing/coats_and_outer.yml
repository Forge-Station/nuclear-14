  name: robe scribe Western bos
  description: An elegant robe symbolizing the status and knowledge of the scribe of the Western Brotherhood of Steel. It provides comfort and protection in the harsh post-apocalyptic world.
  components:
  - type: Sprite
    sprite: Corvax/Clothing/OuterClothing/Coats_and_outer/robeWesternBoS.rsi
  - type: Clothing
    sprite: Corvax/Clothing/OuterClothing/Coats_and_outer/robeWesternBoS.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.85
        Piercing: 0.9
        Heat: 0.85

