- type: entity
  parent: BaseStructure
  id: N14MetalCart
  name: Metal cart
  description: "A trailer made of steel and rust. Apparently, no one ever actually uploaded anything to it."
  suffix: left
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Corvax/Structures/Decoration/carts/cartsempty.rsi
    state: base
    offset: 0.95,-0.2
    noRot: true
    netsync: false
  - type: Transform
    anchored: true
  - type: Physics
    canCollide: true
    bodyStatus: OnGround
    bodyType: Static
  - type: Tag
    tags:
      - Structure
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 5
          N14ScrapSteel1:
            min: 3
            max: 15
          N14ScrapLead1:
            min: 2
            max: 5
      - !type:EmptyAllContainersBehaviour
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.8,2.3,0.4"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable

