- type: entity
  parent: BaseStructure
  id: N14WoodenCart
  name: Wooden cart
  description: "A large wooden wagon, straight out of the Middle Ages! Apparently, no one ever actually uploaded anything to it."
  suffix: left
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Corvax/Structures/Decoration/carts/cartemptywooden.rsi
    state: base
    offset: 0.95,-0.2
    noRot: true
    netsync: false
  - type: Transform
    anchored: true
  - type: Physics
    canCollide: true
    bodyStatus: OnGround
    bodyType: Static
  - type: Tag
    tags:
      - Structure
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 5
            max: 25
      - !type:EmptyAllContainersBehaviour
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.8,2.9,0.9"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable

