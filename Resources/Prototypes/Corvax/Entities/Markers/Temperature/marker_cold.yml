
- type: entity
  id: MarkerCold1
  name: Cold Marker
  parent: MarkerBase
  description: Понижает температуру и замедляет рядом стоящих.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    layers:
      - sprite: Markers/environment.rsi
        state: base-blue
        shader: unshaded
      - sprite: Markers/environment.rsi
        shader: unshaded
        state: weather
  - type: ColdAura
    range: 3
    temperatureChangePerSecond: -10000
    minTemperature: 160.15
    updateInterval: 0.5
    applySlow: true
    walkSpeedModifier: 0.6
    sprintSpeedModifier: 0.6
    slowLinger: 0.75
