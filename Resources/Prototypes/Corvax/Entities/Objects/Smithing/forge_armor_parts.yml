#MARK: Legion Forge Armor Parts (Monstruum)

# Base for all armor parts.
- type: entity
  parent: BaseItem
  id: N14ForgeArmorPartBase
  abstract: true
  components:
  - type: Item
    size: Small
  - type: N14ForgeItem
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.N14ForgePartVisuals.Stage:
        enum.N14ForgePartVisualLayer.Layer:
          Icon: { state: icon }
          OnAnvil: { state: onanvil }
          OnAnvil2: { state: onanvil2 }
          OnDummy: { state: ondummy }

# ---- Arms ----
- type: entity
  parent: N14ForgeArmorPartBase
  id: N14ForgeArmorArmRight
  name: right arm piece
  description: A forged metal arm piece for a suit of heavy armor.
  components:
  - type: Sprite
    sprite: Corvax/Objects/Specific/LegionForge/ARMORPARTS/Monstruum.rsi/arms/rightARM.rsi
    layers:
    - map: ["enum.N14ForgePartVisualLayer.Layer"]
      state: icon
  - type: N14ForgeArmorPart
    kind: Arm
    side: Right

