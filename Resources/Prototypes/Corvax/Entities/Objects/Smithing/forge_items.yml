#MARK: Legion Forge Items (Materials & Smelted Parts)

# Dirty bloom (грязная крица) — hammered on the anvil until clean.
- type: entity
  parent: BaseItem
  id: N14ForgeDirtyBloom
  name: dirty bloom
  description: A lump of crude iron bloom straight from the bloomery. Needs to be hammered clean on an anvil.
  components:
  - type: Sprite
    sprite: Corvax/Objects/Specific/LegionForge/MATERIALS/blooms/bloomdirtyM.rsi
    state: icon
  - type: Item
    size: Small
  - type: N14ForgeItem
  - type: N14ForgeBloom
  - type: Stack
    stackType: N14ForgeBloom
    count: 1

# Clean bloom (варёная крица) — ready for the furnace.
- type: entity
  parent: BaseItem
  id: N14ForgeBloom
  name: clean bloom
  description: A clean lump of wrought iron, ready to be cooked in a furnace.
  components:
  - type: Sprite
    sprite: Corvax/Objects/Specific/LegionForge/MATERIALS/blooms/bloomM.rsi
    state: icon
  - type: Item
    size: Small
  - type: N14ForgeItem
  - type: N14ForgeBloom
    clean: true
  - type: Stack
    stackType: N14ForgeBloom
    count: 1

# Base for flat forged plates (тарелки).
- type: entity
  parent: BaseItem
  id: N14ForgePlateBase
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: plate
  - type: Item
    size: Small
  - type: N14ForgeItem

# Flat plate (тарелка) — furnace result, welded in 4x to make a torso plate.
- type: entity
  parent: N14ForgePlateBase
  id: N14ForgePlate
  name: metal plate
  description: A flat forged metal plate, fresh from the furnace. Several of these can be welded together.
  components:
  - type: Sprite
    sprite: Corvax/Objects/Specific/LegionForge/MATERIALS/plate.rsi
    state: plate
  - type: N14ForgePlate
    plateType: Plate
  - type: Stack
    stackType: N14ForgePlate
    count: 1

# Forged (quenched) flat plate — result of quenching a heated plate. Cannot be welded.
- type: entity
  parent: N14ForgePlateBase
  id: N14ForgeForgedPlate
  name: quenched metal plate
  description: A flat metal plate that has been quenched while hot. It has a hardened edge.
  components:
  - type: Sprite
    sprite: Corvax/Objects/Specific/LegionForge/MATERIALS/plate.rsi
    state: plate
  - type: N14ForgePlate
    plateType: Plate

# Torso plate (сваренная плита) — welded 4x flat plates.
- type: entity
  parent: N14ForgePlateBase
  id: N14ForgeTorsoplate
  name: torso plate
  description: A wide vertical plate welded together from flat plates. Forged into a torso piece on an anvil.
  components:
  - type: Sprite
    sprite: Corvax/Objects/Specific/LegionForge/MATERIALS/torsoplate.rsi
    state: plate
  - type: N14ForgePlate
    plateType: TorsoPlate

# Arm plate (вертикальная половина).
- type: entity
  parent: N14ForgePlateBase
  id: N14ForgeArmPlate
  name: arm plate
  description: A narrow vertical metal plate, to be forged into an arm piece.
  components:
  - type: Sprite
    sprite: Corvax/Objects/Specific/LegionForge/MATERIALS/armplate.rsi
    state: plate
  - type: N14ForgePlate
    plateType: ArmPlate

# Leg plate (горизонтальная половина).
- type: entity
  parent: N14ForgePlateBase
  id: N14ForgeLegPlate
  name: leg plate
  description: A wide horizontal metal plate, to be forged into a leg piece.
  components:
  - type: Sprite
    sprite: Corvax/Objects/Specific/LegionForge/MATERIALS/legplate.rsi
    state: plate
  - type: N14ForgePlate
    plateType: LegPlate

# Forged (кованые) variants — welded plates cooked in the furnace.
# Quenching a heated forged plate later marks it tempered (same prototype/sprite).
- type: entity
  parent: N14ForgePlateBase
  id: N14ForgeForgedTorsoplate
  name: forged torso plate
  description: A torso plate forged in a furnace. Ready for the anvil.
  components:
  - type: Sprite
    sprite: Corvax/Objects/Specific/LegionForge/MATERIALS/forgedtorsoplate.rsi
    state: plate
  - type: N14ForgePlate
    plateType: TorsoPlate
    variant: Forged
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      N14ForgedTorsoplate: 1000
  - type: Tag
    tags:
    - N14ForgeForgedTorsoplate

- type: entity
  parent: N14ForgePlateBase
  id: N14ForgeForgedArmPlate
  name: forged arm plate
  description: An arm plate forged in a furnace.
  components:
  - type: Sprite
    sprite: Corvax/Objects/Specific/LegionForge/MATERIALS/forgedarmplate.rsi
    state: plate
  - type: N14ForgePlate
    plateType: ArmPlate
    variant: Forged

- type: entity
  parent: N14ForgePlateBase
  id: N14ForgeForgedLegPlate
  name: forged leg plate
  description: A leg plate forged in a furnace.
  components:
  - type: Sprite
    sprite: Corvax/Objects/Specific/LegionForge/MATERIALS/forgedlegplate.rsi
    state: plate
  - type: N14ForgePlate
    plateType: LegPlate
    variant: Forged

# Decorations for the mannequin (top / bottom).
- type: entity
  parent: BaseItem
  id: N14ForgeDecorationBase
  abstract: true
  components:
  - type: Item
    size: Small
  - type: N14ForgeItem
  - type: N14ForgeDecoration
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.N14ForgePartVisuals.Stage:
        enum.N14ForgePartVisualLayer.Layer:
          Icon: { state: icon }
          OnDummy: { state: ondummy }

- type: entity
  parent: N14ForgeDecorationBase
  id: N14ForgeDecorationTop
  name: armor decoration (top)
  description: An ornate piece meant to decorate the top of a suit of armor.
  components:
  - type: Sprite
    sprite: Corvax/Objects/Specific/LegionForge/ARMORPARTS/Monstruum.rsi/decorations/top.rsi
    layers:
    - map: ["enum.N14ForgePartVisualLayer.Layer"]
      state: icon
    drawdepth: Mobs
  - type: N14ForgeDecoration
    top: true

- type: entity
  parent: N14ForgeDecorationBase
  id: N14ForgeDecorationBottom
  name: armor decoration (bottom)
  description: An ornate piece meant to decorate the bottom of a suit of armor.
  components:
  - type: Sprite
    sprite: Corvax/Objects/Specific/LegionForge/ARMORPARTS/Monstruum.rsi/decorations/bottom.rsi
    layers:
    - map: ["enum.N14ForgePartVisualLayer.Layer"]
      state: icon
    drawdepth: Mobs
  - type: N14ForgeDecoration
    top: false

# Crude kulons (кулоны) — forged at the bloomery, worked on an anvil:
# a blacksmith hammer turns them into clothing (wearable), a sledgehammer after that imbues special properties.
- type: entity
  parent: BaseItem
  id: N14ForgeCulonBase
  abstract: true
  name: crude kulon
  components:
  - type: Item
    size: Small
  - type: N14ForgeItem
  - type: N14ForgeCulon
  - type: Butcherable
    butcheringType: Knife
    spawned: []
# Worked and final kulons are neck clothing entities (like ClothingNeckPin*).
# ClothingNeckBase provides quickEquip (Z to wear) + the neck slot;
# the per-variant Clothing block below just adds the RSI with the equipped-NECK state.
- type: entity
  parent: ClothingNeckBase
  id: N14ForgeCulonClothingBase
  abstract: true
  name: worked kulon
  components:
  - type: N14ForgeItem
  - type: N14ForgeCulon
  - type: Butcherable
    butcheringType: Knife
    spawned: []
# Crude (необработанный) — can't be worn until worked.
- type: entity
  parent: N14ForgeCulonBase
  id: N14ForgeCulonV1
  name: crude kulon
  description: A crude iron amulet straight from the bloomery. Work it on an anvil to make it wearable and imbue it.
  components:
  - type: Sprite
    sprite: Corvax/Clothing/Neck/ForgeCulonV1.rsi
    state: icon
    scale: 0.6, 0.6

- type: entity
  parent: N14ForgeCulonBase
  id: N14ForgeCulonV2
  name: crude kulon
  description: A crude iron amulet straight from the bloomery. Work it on an anvil to make it wearable and imbue it.
  components:
  - type: Sprite
    sprite: Corvax/Clothing/Neck/ForgeCulonV2.rsi
    state: icon
    scale: 0.7, 0.7

# Worked (обработанный молотом) — clothing, can now be worn as a necklace.
- type: entity
  parent: N14ForgeCulonClothingBase
  id: N14ForgeCulonV1Worked
  name: worked kulon
  description: A shaped iron amulet, worked on an anvil. It can now be worn.
  components:
  - type: Sprite
    sprite: Corvax/Clothing/Neck/ForgeCulonV1.rsi
    state: icon
    scale: 0.6, 0.6
  - type: Clothing
    sprite: Corvax/Clothing/Neck/ForgeCulonV1
    clothingVisuals:
      neck:
      - state: equipped-NECK

- type: entity
  parent: N14ForgeCulonClothingBase
  id: N14ForgeCulonV2Worked
  name: worked kulon
  description: A shaped iron amulet, worked on an anvil. It can now be worn.
  components:
  - type: Sprite
    sprite: Corvax/Clothing/Neck/ForgeCulonV2.rsi
    state: icon
    scale: 0.7, 0.7
  - type: Clothing
    sprite: Corvax/Clothing/Neck/ForgeCulonV2
    clothingVisuals:
      neck:
      - state: equipped-NECK

# Final (обработанный кувалдой) — imbued with special properties.
- type: entity
  parent: N14ForgeCulonV1Worked
  id: N14ForgeCulonV1Final
  name: reflecting kulon
  description: A worked iron amulet that reflects incoming bullets with a small chance.
  components:
  - type: Reflect
    reflectProb: 0.05
    innate: true
    reflects:
    - NonEnergy

- type: entity
  parent: N14ForgeCulonV2Worked
  id: N14ForgeCulonV2Final
  name: swift kulon
  description: A worked iron amulet that makes the wearer move faster.
  components:
  - type: ClothingSpeedModifier
    walkModifier: 1.05
    sprintModifier: 1.05

