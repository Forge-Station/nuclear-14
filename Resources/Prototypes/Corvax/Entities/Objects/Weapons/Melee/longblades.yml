- type: entity
  parent: N14Machete
  id: N14Gladius
  name: gladius
  description: The old sword of the Roman Empire. It is now in use by the Legion...
  components:
  - type: Tag
    tags:
    - N14Gladius
  - type: Item
    sprite: Corvax/Objects/Weapons/Melee/gladius.rsi
  - type: Clothing
    sprite: Corvax/Objects/Weapons/Melee/gladius.rsi
    quickEquip: false
    slots:
    - Belt
    - Back
    - suitStorage
  - type: Sprite
    sprite: Corvax/Objects/Weapons/Melee/gladius.rsi
    state: icon
  - type: MeleeWeapon
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg

- type: entity
  parent: BaseItem
  id: N14WeaponThermospear
  name: thermospear
  description: "A long two-handed thermal spear, fuel is needed for use."
  components:
  - type: Item
    sprite: Corvax/Objects/Weapons/Melee/thermospear.rsi
    size: Huge
  - type: Sprite
    sprite: Corvax/Objects/Weapons/Melee/thermospear.rsi
    layers:
    - state: icon
    - state: welder_flame
      visible: false
      shader: unshaded
      map: ["enum.ToggleVisuals.Layer"]
  - type: Clothing
    sprite: Corvax/Objects/Weapons/Melee/thermospear.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: GenericVisualizer
    visuals:
      enum.ToggleVisuals.Toggled:
        enum.ToggleVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: ItemToggleSize
    activatedSize: Huge
  - type: ItemToggleHot
  - type: UseDelay
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: WelderOn
      params:
        variation: 0.125
        volume: -5
    soundDeactivate:
      collection: WelderOff
      params:
        variation: 0.125
        volume: -5
  - type: MeleeWeapon
    resistanceBypass: true
    wideAnimationRotation: -135
    heavyRateModifier: 1.2
    heavyRangeModifier: 1.8
    heavyDamageBaseModifier: 1
    heavyStaminaCost: 20
    maxTargets: 1
    range: 1.4
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
      params:
        volume: -3
    damage:
      groups:
        Brute: 5
  - type: MultiHandedItem
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
      params:
        variation: 0.250
        volume: -12
    deactivatedSoundOnHitNoDamage:
      collection: MetalThud
    activatedDamage:
        types:
            Heat: 55
  - type: SolutionContainerManager
    solutions:
      Welder:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 250
        maxVol: 250
  - type: Tool
    useSound:
      collection: Welder
    qualities: Welding
    speedModifier: 3
  - type: Welder
  - type: PointLight
    enabled: false
    radius: 2
    color: orange
    netsync: false
  - type: IgniteOnMeleeHit
    fireStacks: 1
  - type: Appearance
  - type: RequiresEyeProtection
  - type: IgnitionSource
    temperature: 700

- type: entity
  parent: BaseItem
  id: N14WeaponKebab
  name: shish kebab
  description: "A one-handed homemade weapon powered by fuel."
  components:
  - type: Sprite
    sprite: Corvax/Objects/Weapons/Melee/kebab.rsi
    layers:
    - state: icon
    - state: welder_flame
      visible: false
      shader: unshaded
      map: ["enum.ToggleVisuals.Layer"]
  - type: Item
    sprite: Corvax/Objects/Weapons/Melee/kebab.rsi
    size: Large
  - type: Clothing
    sprite: Corvax/Objects/Weapons/Melee/kebab.rsi
    quickEquip: false
    slots:
    - belt
  - type: GenericVisualizer
    visuals:
      enum.ToggleVisuals.Toggled:
        enum.ToggleVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: ItemToggleSize
    activatedSize: Huge
  - type: ItemToggleHot
  - type: ToggleableLightVisuals
