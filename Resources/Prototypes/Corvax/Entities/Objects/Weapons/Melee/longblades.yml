#Перенёс из категории _Nuclear14\Entities\Objects\Tools\tools.yml
- type: entity
  parent: BaseItem
  id: N14Chainsaw
  name: chainsaw
  description: A very large chainsaw. Usually you use this for cutting down trees... usually.
  components:
  - type: Item
    size: Huge
    sprite: Objects/Weapons/Melee/chainsaw.rsi
  - type: Sprite
    sprite: Objects/Weapons/Melee/chainsaw.rsi
    state: icon
  - type: Wieldable
    wieldSound: !type:SoundPathSpecifier
      path: /Audio/Weapons/chainsawwield.ogg
      params:
        volume: -3
  - type: MeleeWeapon
    damage:
      types:
        Slash: 5
    attackRate: 1.5
    heavyRateModifier: 1.5
    heavyRangeModifier: 1.4
    heavyDamageBaseModifier: 1
    heavyStaminaCost: 20
    maxTargets: 1
    angle: 80
    soundHit:
      path: /Audio/Weapons/chainsaw.ogg
      params:
        volume: -3
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 25
        Slash: 35
  - type: SolutionContainerManager
    solutions:
      melee:
        maxVol: 9
        reagents:
        - ReagentId: Razorium
          Quantity: 9
  - type: SolutionRegeneration
    solution: melee
    generated:
      reagents:
      - ReagentId: Razorium
        Quantity: 9
  - type: Sharp
  - type: DisarmMalus
  - type: UseDelay
    delay: 1
  - type: Tool
    qualities:
      - Sawing
    speedModifier: 3.0
  - type: SurgeryTool
    startSound:
      path: /Audio/Medical/Surgery/saw.ogg
  - type: BoneSaw
    speed: 0.6

