  - type: entity
    id: DrumMagazineNailGun
    name: Nailgun drum magazine
    parent: BaseItem
    components:
    - type: Tag
      tags:
        - DrumMagazineNailGun
    - type: BallisticAmmoProvider
      mayTransfer: true
      whitelist:
        tags:
          - N14CartridgeNail
      capacity: 35
      proto: N14CartridgeNail
    - type: ContainerContainer
      containers:
        ballistic-ammo: !type:Container
    - type: Sprite
      netsync: false
      sprite: Corvax/Objects/Weapons/Guns/Ammunition/Magazines/nail/nailmag.rsi
      layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-1
        map: ["enum.GunVisualLayers.Mag"]
    - type: MagazineVisuals
      magState: mag
      steps: 2
      zeroVisible: false
    - type: Appearance
    - type: ToolRefinable #Forge-add
      refineResult:
      - id: SheetSteel1
        amount: 1
