  description: Маленькая закуска с икрой.
  components:
  - type: Sprite
    sprite: Corvax/Objects/Consumable/Food/caviar_food.rsi
    state: tartletredcaviar

- type: entity
  name: тост с икрой
  parent: N14CookedFoodBreadBase
  id: FoodCaviarToast
