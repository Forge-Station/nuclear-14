  description: Баночка свежей красной икры.
  components:
  - type: Sprite
    sprite: Corvax/Objects/Consumable/Food/redcaviar.rsi
    state: redcaviar

- type: entity
  name: тартлетка с икрой
  parent: N14CookedFoodBreadBase
