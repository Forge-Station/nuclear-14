- type: entity
  parent: FoodTinBase
  id: N14FoodCannedFish
  name: рыбные консервы
  description: Жестяная банка с консервированной рыбой. Подозрительно напоминает довоенные запасы.
  components:
  - type: Sprite
    sprite: Corvax/Objects/Consumable/Food/canned_fish.rsi
    state: icon
  - type: FlavorProfile
    flavors:
    - fishy
  - type: Food
    trash:
    - N14FoodCannedFishTrash
  - type: Tag
    tags:
    - Meat
    - Soup

- type: entity
  parent: FoodTinBaseTrash
  id: N14FoodCannedFishTrash
  name: пустая рыбная консерва
  components:
  - type: Sprite
    sprite: Corvax/Objects/Consumable/Food/canned_fish.rsi
    state: trash
