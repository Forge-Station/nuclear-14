- type: constructionGraph
  id: N14RugRedGraph
  start: start
  graph:
    - node: start
      edges:
        - to: N14RugRedNode
          steps:
            - material: Cloth
              amount: 5
              doAfter: 2
          completed:
            - !type:SnapToGrid
              southRotation: true
    - node: N14RugRedNode
      entity: N14RugRed
      edges:
        - to: start
          completed:
            - !type:GivePrototype
              prototype: MaterialCloth1
              amount: 2
            - !type:DeleteEntity {}

