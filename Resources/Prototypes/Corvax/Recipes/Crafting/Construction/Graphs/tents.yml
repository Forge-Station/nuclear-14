#Cloth
- type: constructionGraph
  id: N14TentClothWallGraph
  start: start
  graph:
    - node: start
      edges:
        - to: N14TentClothWallNode
          steps:
            - material: Cloth
              amount: 2
              doAfter: 5
          completed:
            - !type:SnapToGrid
              southRotation: true

    - node: N14TentClothWallNode
      entity: N14TentClothWall
      edges:
        - to: start
          completed:
            - !type:GivePrototype
              prototype: MaterialCloth1
              amount: 1
            - !type:DeleteEntity {}

