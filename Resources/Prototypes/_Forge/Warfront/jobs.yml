- type: job
  id: WarfrontNCRCaptain
  setPreference: true
  overrideConsoleVisibility: false
  canBeAntag: false
  name: warfront-job-name-ncr-captain
  description: warfront-job-description-ncr-captain
  playTimeTracker: WarfrontNCRCaptain
  requirements:
  - !type:CharacterDepartmentTimeRequirement
    department: NCR
    min: 216000
  - !type:CharacterPlaytimeRequirement
    tracker: NCRNCO
    min: 43200
  weight: 10
  startingGear: WarfrontNCRCaptainGear
  icon: "JobIconNcrLeader"
  supervisors: job-supervisors-ncr-lt
  requireAdminNotify: true
  alwaysUseSpawner: true
  access:
  - NCR
  - NCRSGT
  - NCRMedic
  - NCRLT
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - NCR

- type: playTimeTracker
  id: WarfrontNCRCaptain

