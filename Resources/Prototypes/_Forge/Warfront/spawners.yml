- type: entity
  abstract: true
  parent: MarkerBase
  id: WarfrontBaseSpawner
  name: ghost role spawn point
  components:
  - type: GhostRole
    rules: warfront-role-rules
    raffle:
      settings: default
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green

