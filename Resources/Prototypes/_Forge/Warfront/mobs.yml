# У Легиона нет медика в основной игре — набор собран из существующей
# экипировки декана с заменой пояса на медицинский.
- type: startingGear
  id: WarfrontLegionFieldMedicGear
  equipment:
    jumpsuit: N14ClothingUniformJumpsuitLegionnaire
    outerClothing: N14ClothingOuterDeanLegionnaireRecruitArmor
    head: N14ClothingHeadHatDeanRecruitHelmet
    neck: ClothingNeckRedScarf
    back: N14ClothingBackpackMilitary
    shoes: N14ClothingBootsBlack
    gloves: N14ClothingHandsGlovesTribal
    belt: N14ClothingBeltMedicalFilled
    id: N14IDLegionaryMedalSilver3
  innerClothingSkirt: N14ClothingUniformJumpsuitLegionnaireOther
  storage:
    back:
    - N14BoxPlasticFilledMilitaryLegion

