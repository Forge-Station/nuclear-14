- type: entity
  parent: BaseComputerAiAccess
  id: OutpostCaptureConsole
  name: консоль аванпоста
  suffix: warfront
  components:
  - type: CapturePoint
    title: capture-point-window-title-outpost
    captureDuration: 10 #120
    captureCooldown: 30
    pointsPerMinute: 20 #5
  - type: ActivatableUI
    key: enum.CapturePointUiKey.Key
  - type: UserInterface
    interfaces:
      enum.CapturePointUiKey.Key:
        type: CapturePointBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

- type: entity
  parent: BaseComputerAiAccess
  id: CitadelCaptureConsole
  name: консоль цитадели
  suffix: warfront
  components:
  - type: CapturePoint
    title: capture-point-window-title-citadel
    captureDuration: 300
    captureCooldown: 60
    pointsPerMinute: 3
    victoryHoldDuration: 900
  - type: ActivatableUI
    key: enum.CapturePointUiKey.Key
  - type: UserInterface
    interfaces:
      enum.CapturePointUiKey.Key:
        type: CapturePointBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
