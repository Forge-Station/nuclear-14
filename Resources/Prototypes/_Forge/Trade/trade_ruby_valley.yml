# Контракты: только караванные и повседневные
# ----------------------------
- type: storeContractsPreset
  id: PresetRubyValleyBazar
  contractOffers:
    maxVisible: 10
    groups:
    - pool: BazarEverydayOrders
      minVisible: 3
      maxVisible: 4
      fillWeight: 5
    - pool: BazarCaravanOrders
      minVisible: 2
      maxVisible: 3
      fillWeight: 3