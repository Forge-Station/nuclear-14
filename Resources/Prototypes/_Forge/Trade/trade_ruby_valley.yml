# Торготрон Руби-Вэлли
# Отдельный торгомат в виде протектрона. Ассортимент — копия городского
# (caravan_buy2) с изменениями, цены базовые увеличены в 2 раза.

# ----------------------------
# Профиль и сам торгомат
# ----------------------------
- type: ncStoreProfile
  id: TrademachineRubyValleyProfile
  buy:
  - ruby_buy
  sell:
  - caravan_sell2
  barter:
  - BarterPresetCityCurrency
  contracts: PresetRubyValleyBazar
  theme: TradeUiThemeWasteland

- type: entity
  id: TrademachineRubyValley
  parent: Trademachine
  name: Торготрон Руби-Вэлли
  description: Торговый автомат в виде протектрона. Выбирай, плати, забирай.
  suffix: vendor, Ruby Valley
  components:
  - type: NcStore
    profile: TrademachineRubyValleyProfile
  - type: Sprite
    sprite: _Nuclear14/Mobs/Robots/protectron.rsi
    layers:
    - state: icon
      map: ["enum.VendingMachineVisualLayers.Base"]

