# Forge material profiles for entities that participate in the surface-fire loop.
# Do not apply these automatically based on names, tags, or damage modifier sets.

- type: entity
  id: ForgeBaseFlammableWoodLight
  abstract: true
  components:
  - type: Flammable
    fireSpread: true
    alwaysCombustible: true
    firestacksOnIgnite: 2
    firestackFade: -0.12
    damage:
      types:
        Heat: 1.5
  - type: Appearance
  - type: FireVisuals
    sprite: _RMC14/Effects/fire.rsi
    normalState: red_1
    alternateState: red_2
  - type: Reactive
    groups:
      Extinguish: [ Touch ]
  - type: FirePropagation
    spreadFireStacks: 0.35
    incomingMultiplier: 1.25
    ignitionThreshold: 1
    maximumIncomingStacksPerTick: 0.6

