# Кости

- type: entity
  parent: BaseItem
  id: ForgeAnimalBone
  name: кости
  description: Прочные кости, оставшиеся после разделки.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/mob_drops.rsi
    layers:
    - state: bone
      map: ["base"]
  - type: Stack
    stackType: ForgeAnimalBone
    count: 1
    baseLayer: base
    layerStates:
    - bone
    - bone
    - bone_2
    - bone_2
    - bone_3
  - type: Appearance
  - type: Item
    size: Small
  - type: Tag
    tags:
    - ForgeLootBone
- type: stack
  id: ForgeAnimalBone
  name: кости
  icon: { sprite: _Nuclear14/Objects/Misc/mob_drops.rsi, state: bone }
  spawn: ForgeAnimalBone
  maxCount: 5

# Варианты начального количества одной общей стопки.
- type: entity
  parent: ForgeAnimalBone
  id: ForgeAnimalBone2
  suffix: 2
  components:
  - type: Stack
    count: 2

- type: entity
  parent: ForgeAnimalBone
  id: ForgeAnimalBone3
  suffix: 4
  components:
  - type: Stack
    count: 4

- type: entity
  parent: BaseItem
  id: ForgeAnimalClaw
  name: костяной коготь
  description: Крепкий коготь животного.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/mob_drops.rsi
    state: bone_claw
  - type: Item
    size: Small
  - type: Tag
    tags:
    - ForgeLootBone

# Сухожилия

- type: entity
  parent: BaseItem
  id: ForgeAnimalSinew
  name: сухожилия
  description: Сухожилия, извлечённые из туши животного.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/mob_drops.rsi
    layers:
    - state: sinew
      map: ["base"]
  - type: Stack
    stackType: ForgeAnimalSinew
    count: 1
    baseLayer: base
    layerStates:
    - sinew
    - sinewcuff
    - sinewcuff
    - sinewcuff
    - sinewcuff
  - type: Appearance
  - type: Item
    size: Small
  - type: Tag
    tags:
    - ForgeLootSinew

- type: stack
  id: ForgeAnimalSinew
  name: сухожилия
  icon: { sprite: _Nuclear14/Objects/Misc/mob_drops.rsi, state: sinew }
  spawn: ForgeAnimalSinew
  maxCount: 5

- type: entity
  parent: Zipties
  id: ForgeAnimalSinewCuff
  name: петля из сухожилий
  description: Петля из сухожилий для связывания рук. Рвётся при снятии.
  components:
  - type: Handcuff
    brokenPrototype: ForgeAnimalSinewCuffBroken
    startCuffSound:
      path: /Audio/Items/Handcuffs/rope_start.ogg
    endCuffSound:
      path: /Audio/Items/Handcuffs/rope_end.ogg
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/mob_drops.rsi
    state: sinewcuff
  - type: Item
    size: Small
  - type: Construction
    graph: ForgeSinewCuff
    node: cuff

- type: entity
  parent: BaseItem
  id: ForgeAnimalSinewCuffBroken
  name: порванная петля из сухожилий
  description: Обрывки сухожилий. Связать ими кого-нибудь уже не получится.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/mob_drops.rsi
    state: sinew
  - type: Item
    size: Small
  - type: Tag
    tags:
    - Trash

