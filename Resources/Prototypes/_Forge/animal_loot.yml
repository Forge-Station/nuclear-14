# Муравьи

- type: entity
  parent: FoodBase
  id: ForgeFoodAntBrain
  name: мозг муравья
  description: Небольшой мозг гигантского муравья. Выглядит неаппетитно.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Consumable/Food/pre-war.rsi
    state: ant_brain
  - type: FlavorProfile
    flavors:
    - meaty
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
  - type: Item
    size: Small

- type: entity
  parent: N14FoodEggBase
