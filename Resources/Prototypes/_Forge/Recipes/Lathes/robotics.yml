# Forge-Change: рецепты запчастей хламотрона из скрапа для верстака изготовления роботов.
# Цифры пока произвольные — задача показать, что детали крафтятся из лома.
# Каждый вид лома (электроники/стали/свинца/меди/латуни/золота) задействован хотя бы
# в одном рецепте, поэтому все они попадают в material-whitelist верстака и становятся
# доступны для загрузки.

