# Forge-Change
- type: metabolizerType
  id: supermutant
  name: metabolizer-type-supermutant

- type: entity
  save: false
  name: Urist McHands The Supermutant
  parent: BaseMobSpeciesOrganic
  id: BaseMobSupermutant
  abstract: true
  components:
  - type: Sprite
    sprite: _Corvax/Mobs/Species/Supermutant/parts.rsi
    netsync: false
    noRot: true
    drawdepth: Mobs
    layers:
      - map: [ "enum.HumanoidVisualLayers.Chest" ]
      - map: [ "enum.HumanoidVisualLayers.Head" ]
      - map: [ "enum.HumanoidVisualLayers.Snout" ]
      - map: [ "enum.HumanoidVisualLayers.Eyes" ]
      - map: [ "enum.HumanoidVisualLayers.RArm" ]
      - map: [ "enum.HumanoidVisualLayers.LArm" ]
      - map: [ "enum.HumanoidVisualLayers.RLeg" ]
      - map: [ "enum.HumanoidVisualLayers.LLeg" ]
      - shader: StencilClear
        sprite: _Corvax/Mobs/Species/Supermutant/parts.rsi
        state: l_leg
      - shader: StencilMask
        map: [ "enum.HumanoidVisualLayers.StencilMask" ]
        sprite: Mobs/Customization/masking_helpers.rsi
        state: female_full
        visible: false
      - map: [ "jumpsuit" ]
      - map: [ "enum.HumanoidVisualLayers.LHand" ]
      - map: [ "enum.HumanoidVisualLayers.RHand" ]
      - map: [ "enum.HumanoidVisualLayers.LFoot" ]
      - map: [ "enum.HumanoidVisualLayers.RFoot" ]
      - map: [ "enum.HumanoidVisualLayers.Handcuffs" ]
        color: "#ffffff"
        sprite: Objects/Misc/handcuffs.rsi
        state: body-overlay-2
        visible: false
      - map: [ "id" ]
      - map: [ "gloves" ]
      - map: [ "shoes" ]
      - map: [ "ears" ]
      - map: [ "outerClothing" ]
      - map: [ "eyes" ]
      - map: [ "belt" ]
      - map: [ "neck" ]
      - map: [ "back" ]
      - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
      - map: [ "enum.HumanoidVisualLayers.Hair" ]
      - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
      - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
      - map: [ "enum.HumanoidVisualLayers.Tail" ]
      - map: [ "mask" ]
      - map: [ "head" ]
      - map: [ "pocket1" ]
      - map: [ "pocket2" ]
  - type: Perishable
    rotAfter: 3600 # An entire in-game day.
  - type: Hunger
    thresholds:
      Overfed: 400
      Okay: 300
      Peckish: 200
      Starving: 100
      Dead: 0
    baseDecayRate: 0.09
    starvationDamage:
      types:
        Cold: 0.15
    starvingSlowdownModifier: 0.5
  - type: Thirst
    thresholds:
      OverHydrated: 400
      Okay: 300
      Thirsty: 200
      Parched: 100
      Dead: 0
    baseDecayRate: 0.15
  - type: Icon
    sprite: Mobs/Species/Slime/parts.rsi # It was like this beforehand, no idea why.
    state: full
  - type: Respirator
    damage:
      types:
        Asphyxiation: 1
        Bloodloss: 0.5
    damageRecovery:
      types:
        Asphyxiation: -1
  - type: Body
    prototype: Supermutant
    requiredLegs: 2
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 4
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        # they r smaller
        density: 150
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Vocal
    sounds:
      Male: MaleSupermutant
      Female: FemaleSupermutant
      Unsexed: MaleSupermutant
  - type: Speech
    speechSounds: Alto
  - type: HumanoidAppearance
    species: Supermutant
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Critical
      400: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.4
    baseSprintSpeed: 3.4
  - type: SlowOnDamage
    speedModifierThresholds:
      100: 1
      120: 0.9
      150: 0.8
      175: 0.7
      190: 0.5
  - type: MeleeWeapon
    altDisarm: true
    attackRate: 1.5
    angle: 60
    damage:
      types:
        Blunt: 15
  - type: Inventory
    templateId: supermutant
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - SupermutantArmor
  - type: Damageable
    damageModifierSet: Supermutant
  - type: Destructible
  thresholds:
  - trigger:
      !type:DamageTypeTrigger
      damageType: Blunt
      damage: 2500
    behaviors:
    - !type:GibPartBehavior {}
  - trigger:
      !type:DamageTypeTrigger
      damageType: Heat
      damage: 2500
    behaviors:
    - !type:SpawnEntitiesBehavior
      spawnInContainer: true
      spawn:
        Ash:
          min: 2
          max: 5
    - !type:BurnBodyBehavior {}
    - !type:PlaySoundBehavior
      sound:
        collection: MeatLaserImpact
  - type: WhitelistClothing
    whitelist: SupermutantArmor
    whitelistState: humanoid
  - type: Stamina
    critThreshold: 200

  - type: Bloodstream
    bloodlossDamage:
      types:
        Bloodloss: 0.5
    bloodlossHealDamage:
      types:
        Bloodloss: -1.5
    bloodRegenerationHunger: 1.5
    bloodRegenerationThirst: 2
    bloodMaxVolume: 200
    bloodReagent: WastelandBlood

  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#88221f"

  - type: Barotrauma
    damage:
      types:
        Blunt: 0.30 #per second, scales with pressure and other constants.
        Heat: 0.05
  - type: PassiveDamage # Slight passive regen. Assuming one damage type, comes out to about 4 damage a minute.
    allowedStates:
    - Alive
    - Critical
    damageCap: 300
    damage:
      types:
        Heat: -0.5
        Poison: -0.5
        Radiation: -0.1
      groups:
        Brute: -0.5
        Genetic: -10

- type: damageModifierSet
  id: Supermutant
  coefficients:
    Blunt: 1.0
    Slash: 1.0
    Piercing: 1.0
    Heat: 1.0
    Poison: 0.1
    Cold: 0.5
    Shock: 1.0
    Radiation: 0.1
    Cellular: 0.0

- type: entity
  save: false
  name: Urist McSupermutant
  parent: MobHumanDummy
