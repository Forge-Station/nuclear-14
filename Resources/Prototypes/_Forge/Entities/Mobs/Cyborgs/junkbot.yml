# хламобот — кустарный борг, собирается на кустарном эндоскелете (граф N14JunktronCyborg).
- type: entity
  id: N14Junkbot
  parent: BorgChassisGeneric
  name: junkbot
  components:
  - type: Construction
    graph: N14JunktronCyborg
    node: cyborg
  - type: BorgTransponder
    name: junkbot
  # фракция Wastelander (а не унаследованная NanoTrasen): иначе пустошные мобы N14
  # (Raider/Feral/животные/HostileRobot) не считают борга врагом — у них в hostile только
  # пустошные фракции. Wastelander есть в их списках, как у игроков-выживших.
  - type: NpcFactionMember
    factions:
    - Wastelander
  # случайные глючные законы на спавне; переписываются перфокартой. N14JunkbotLaws — запасной свод.
  - type: SiliconLawProvider
    laws: N14JunkbotLaws
  - type: RandomSiliconLaws
  # запрещаем ручной тоггл борга активацией (E по себе) — иначе со свободной рукой
  # манипулятора борг выключает/включает свои модули. База ставит только onUse: false, но не onActivate.
  - type: ItemToggle
    onUse: false
    onActivate: false
  # без заряженной ячейки борг не активируется (ванильный ToggleCellDraw: гейтит ItemToggle по заряду).
  - type: ToggleCellDraw
  # только двоичный радиоканал (база борга даёт Binary/Common/Science).
  - type: IntrinsicRadioTransmitter
    channels:
    - Binary
  - type: ActiveRadio
    channels:
    - Binary
  # гейт меню борга — вскрытие панели отвёрткой (10с), а не ID-замок: Lock и AccessReader отключены.
  - type: WiresPanel
    openDelay: 10
  - type: Lock
    locked: false
  - type: AccessReader
    enabled: false
    access: []
  # убираем худ-просмотрщики иконок (job/mindshield) — иначе клиент борга падает
  # на чужих битых статус-иконках (StatusIconOverlay). RemoveComponents снимает их на старте.
  - type: RemoveComponents
    components:
    - ShowJobIcons
    - ShowMindShieldIcons
  # кукла урона (выбор части тела) — у борг-шасси её нет по умолчанию.
  - type: Targeting
  # форджевый «прицел» — CameraFollow даёт экшен ActionToggleCamera
  # (грантится FollowDistanceSystem на MapInit); с оружием, имеющим FollowDistance, расширяет обзор.
  - type: CameraFollow
