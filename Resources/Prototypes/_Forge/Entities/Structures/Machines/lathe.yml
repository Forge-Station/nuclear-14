# "верстак изготовления роботов" — единообразен с верстаками N14 (parent N14WorkbenchBase); крафтит детали хламотрона из скрапа; спавн/маппинг.
- type: entity
  parent: N14WorkbenchBase
  id: N14RobotFabricator
  name: robot assembly workbench
  description: A workbench for printing junktron parts out of scrap to assemble robots.
  components:
  - type: Sprite
    state: tinkerbench
  # MaterialStorage наследуется от N14WorkbenchBase без тегового вайтлиста: что принимать, лат считает динамически из материалов рецептов (MaterialWhiteList).
  - type: Lathe
    idleState: icon
    runningState: icon # change this
    staticRecipes:
    - N14JunktronEndoskeleton
    - N14JunktronTorso
    - N14JunktronHead
    - N14JunktronLeftArm
    - N14JunktronRightArm
    - N14JunktronLeftLeg
    - N14JunktronRightLeg
    - N14OpticalSensor
    - N14JunktronMMI
    - N14JunktronPositronicBrain
    - N14LawCard
    - N14BorgModuleJunkTools
    - N14BorgModuleJunkGardening
    - N14BorgModuleJunkBureaucracy
    - N14BorgModuleJunkCombat
    - N14BorgModuleJunkManipulator
    - N14BorgModuleJunkMining
    - N14BorgModuleJunkMusique
    dynamicRecipes: []
  # неразрушаемый: единственный порог 10000 заменяет пороги BaseStructure (псевдо-неразрушаемость, по твоему запросу).
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10000
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
