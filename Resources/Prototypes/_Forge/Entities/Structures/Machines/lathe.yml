# Forge-Change: аналог "фабрикатора экзокостюмов" из оригинальной SS14.
# Все рецепты (включая те, что в оригинале требуют исследования) открыты по умолчанию.
# Наследуется от ExosuitFabricator, поэтому спрайт, плата, хранилище материалов
# и emag-рецепты берутся от него. Переопределяется только список рецептов Lathe.
# Получение в игре: пока только спавн админом / расстановка маппером (плата будет добавлена позже).
