# "верстак изготовления роботов" — аналог ExosuitFabricator, крафтит детали хламотрона из скрапа.
# Получение пока только спавн/маппинг (плата будет позже).
- type: entity
  id: N14RobotFabricator
  parent: ExosuitFabricator
  name: robot assembly workbench
  description: A workbench for printing junktron parts out of scrap to assemble robots.
  components:
  # whitelist родителя + тег Scrap (всё лом). Важно: lathe принимает материал, только если его
  # потребляет какой-то рецепт (material-whitelist строится из рецептов) — потому скрап и вставляется.
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
      - Wooden
      - ClothMade
      - Gauze
      - Metal
      - Scrap
  - type: Lathe
    staticRecipes:
    - N14JunktronEndoskeleton
    - N14JunktronTorso
    - N14JunktronHead
    - N14JunktronLeftArm
    - N14JunktronRightArm
    - N14JunktronLeftLeg
    - N14JunktronRightLeg
    - N14OpticalSensor
    - N14JunktronMMI
    - N14JunktronPositronicBrain
    - N14LawCard
    - N14BorgModuleJunkTools
    - N14BorgModuleJunkGardening
    - N14BorgModuleJunkBureaucracy
    - N14BorgModuleJunkCombat
    - N14BorgModuleJunkManipulator
    - N14BorgModuleJunkMining
    - N14BorgModuleJunkMusique
    dynamicRecipes: []
  # Чистим унаследованные emag-рецепты (боевые мехи).
  - type: EmagLatheRecipes
    emagDynamicRecipes: []
