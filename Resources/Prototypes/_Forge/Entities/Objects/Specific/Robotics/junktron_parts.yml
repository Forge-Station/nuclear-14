# Forge-Change: запчасти "хламотрона" — кустарные аналоги запчастей киборга,
# которые крафтятся из скрапа на верстаке изготовления роботов (N14RobotFabricator).
#
# Намеренно используют те же теги (BorgGeneric*), что и обычные запчасти борга:
# благодаря этому они надеваются на CyborgEndoskeleton через штатную сборку "generic"
# и собираются в обычное шасси борга. Вся дальнейшая логика — как у оригинальных боргов.
# Спрайты пока переиспользуют обычные борг-детали (cyborg_parts.rsi) — своих нет.

- type: entity
  id: N14JunktronLeftArm
  parent: BaseBorgArmLeft
  name: junktron left arm
  components:
  - type: Sprite
    state: borg_l_arm
  - type: Icon
    state: borg_l_arm
  - type: Tag
    tags:
    - Trash
    - BorgArm
    - BorgGenericLArm

- type: entity
  id: N14JunktronRightArm
  parent: BaseBorgArmRight
  name: junktron right arm
  components:
  - type: Sprite
    state: borg_r_arm
  - type: Icon
    state: borg_r_arm
  - type: Tag
    tags:
    - Trash
    - BorgArm
    - BorgGenericRArm

- type: entity
  id: N14JunktronLeftLeg
  parent: BaseBorgLegLeft
  name: junktron left leg
  components:
  - type: Sprite
    state: borg_l_leg
  - type: Icon
    state: borg_l_leg
  - type: Tag
    tags:
    - Trash
    - BorgLeg
    - BorgGenericLLeg

- type: entity
  id: N14JunktronRightLeg
  parent: BaseBorgLegRight
  name: junktron right leg
  components:
  - type: Sprite
    state: borg_r_leg
  - type: Icon
    state: borg_r_leg
  - type: Tag
    tags:
    - Trash
    - BorgLeg
    - BorgGenericRLeg

- type: entity
  id: N14JunktronHead
  parent: BaseBorgHead
  name: junktron head
  components:
  - type: Sprite
    state: borg_head
  - type: Icon
    state: borg_head
  - type: Tag
    tags:
    - Trash
    - BorgHead
    - BorgGenericHead

- type: entity
  id: N14JunktronTorso
  parent: BaseBorgTorso
  name: junktron torso
  components:
  - type: Sprite
    state: borg_chest
  - type: Icon
    state: borg_chest
  - type: Tag
    tags:
    - Trash
    - BorgGenericTorso

# Оптический сенсор — заменяет вспышку при сборке кустарного борга.
# НАМЕРЕННО не имеет компонента Flash, поэтому как вспышка-оружие не работает.
# В графе N14JunktronCyborg требуется по тегу N14OpticalSensor.
- type: entity
  id: N14OpticalSensor
  parent: BaseItem
  name: optical sensor
  description: A salvaged optical sensor. Used in place of a flash when assembling junktron robots.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/flash.rsi
    state: flash
  - type: Item
    size: Small
  - type: Tag
    tags:
    - N14OpticalSensor

# Кустарный эндоскелет — аналог CyborgEndoskeleton. PartAssembly, ItemMapper и контейнеры
# наследуются от него, поэтому на него надеваются те же (generic-тегованные) детали хламотрона.
# Отличие — собственный граф сборки N14JunktronCyborg, где вместо вспышек нужны оптические сенсоры.
- type: entity
  id: N14JunktronEndoskeleton
  parent: CyborgEndoskeleton
  name: makeshift endoskeleton
  description: A crude frame that junktron robots are built on.
  components:
  - type: Construction
    graph: N14JunktronCyborg
    node: start
    defaultTarget: cyborg
    containers:
    - part-container
    - cell_slot

# Кустарный аналог ММИ. Наследует всю логику MMI (компонент BorgBrain, слот органического
# мозга, радио), поэтому принимается боргом как мозг. Отличается только именем и крафтом из лома.
- type: entity
  id: N14JunktronMMI
  parent: MMI
  name: junk-machine interface
  description: A crude man-machine interface cobbled together from scrap. Lets a biological brain pilot a junkbot.

# Кустарный аналог позитронного мозга. Наследует логику PositronicBrain (BorgBrain + гост-роль),
# поэтому в нём может поселиться дух и он устанавливается в хламобота как мозг.
- type: entity
  id: N14JunktronPositronicBrain
  parent: PositronicBrain
  name: junktron positronic brain
  description: A salvaged artificial brain assembled from scrap electronics. Surprisingly, it thinks.
