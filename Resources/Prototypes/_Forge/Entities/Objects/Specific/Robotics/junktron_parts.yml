# запчасти "хламотрона" из скрапа. Несут штатные теги BorgGeneric*, поэтому
# надеваются на CyborgEndoskeleton как обычные детали борга. Спрайты — от обычных борг-деталей.

- type: entity
  id: N14JunktronLeftArm
  parent: BaseBorgArmLeft
  name: junktron left arm
  components:
  - type: Sprite
    state: borg_l_arm
  - type: Icon
    state: borg_l_arm
  - type: Tag
    tags:
    - Trash
    - BorgArm
    - BorgGenericLArm

- type: entity
  id: N14JunktronRightArm
  parent: BaseBorgArmRight
  name: junktron right arm
  components:
  - type: Sprite
    state: borg_r_arm
  - type: Icon
    state: borg_r_arm
  - type: Tag
    tags:
    - Trash
    - BorgArm
    - BorgGenericRArm

- type: entity
  id: N14JunktronLeftLeg
  parent: BaseBorgLegLeft
  name: junktron left leg
  components:
  - type: Sprite
    state: borg_l_leg
  - type: Icon
    state: borg_l_leg
  - type: Tag
    tags:
    - Trash
    - BorgLeg
    - BorgGenericLLeg

- type: entity
  id: N14JunktronRightLeg
  parent: BaseBorgLegRight
  name: junktron right leg
  components:
  - type: Sprite
    state: borg_r_leg
  - type: Icon
    state: borg_r_leg
  - type: Tag
    tags:
    - Trash
    - BorgLeg
    - BorgGenericRLeg

- type: entity
  id: N14JunktronHead
  parent: BaseBorgHead
  name: junktron head
  components:
  - type: Sprite
    state: borg_head
  - type: Icon
    state: borg_head
  - type: Tag
    tags:
    - Trash
    - BorgHead
    - BorgGenericHead

- type: entity
  id: N14JunktronTorso
  parent: BaseBorgTorso
  name: junktron torso
  components:
  - type: Sprite
    state: borg_chest
  - type: Icon
    state: borg_chest
  - type: Tag
    tags:
    - Trash
    - BorgGenericTorso

# Оптический сенсор: замена вспышке в графе N14JunktronCyborg (по тегу). БЕЗ компонента Flash — засветить нельзя.
- type: entity
  id: N14OpticalSensor
  parent: BaseItem
  name: optical sensor
  description: A salvaged optical sensor. Used in place of a flash when assembling junktron robots.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/flash.rsi
    state: flash
  - type: Item
    size: Small
  - type: Tag
    tags:
    - N14OpticalSensor

# Кустарный эндоскелет: аналог CyborgEndoskeleton, но со своим графом N14JunktronCyborg.
- type: entity
  id: N14JunktronEndoskeleton
  parent: CyborgEndoskeleton
  name: makeshift endoskeleton
  description: A crude frame that junktron robots are built on.
  components:
  - type: Construction
    graph: N14JunktronCyborg
    node: start
    defaultTarget: cyborg
    containers:
    - part-container
    - cell_slot

# Кустарный ММИ: наследует MMI (BorgBrain + слот мозга), принимается боргом.
- type: entity
  id: N14JunktronMMI
  parent: MMI
  name: junk-machine interface
  description: A crude man-machine interface cobbled together from scrap. Lets a biological brain pilot a junkbot.

# Кустарный позитронный мозг: наследует PositronicBrain (BorgBrain + гост-роль).
- type: entity
  id: N14JunktronPositronicBrain
  parent: PositronicBrain
  name: junktron positronic brain
  description: A salvaged artificial brain assembled from scrap electronics. Surprisingly, it thinks.
