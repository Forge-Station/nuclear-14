# Кустарный эндоскелет: аналог CyborgEndoskeleton, но со своим графом N14JunktronCyborg.
- type: entity
  id: N14JunktronEndoskeleton
  parent: CyborgEndoskeleton
  components:
  - type: Sprite
    sprite: _Forge/Objects/Specific/Robotics/salvaged_endoskeleton.rsi
    state: robo_suit
  - type: ItemMapper
    sprite: _Forge/Objects/Specific/Robotics/salvaged_endoskeleton.rsi
    mapLayers:
      junkbot_l_arm+o:
        whitelist:
          tags:
          - BorgGenericLArm
      junkbot_r_arm+o:
        whitelist:
          tags:
          - BorgGenericRArm
      junkbot_l_leg+o:
        whitelist:
          tags:
          - BorgGenericLLeg
      junkbot_r_leg+o:
        whitelist:
          tags:
          - BorgGenericRLeg
      junkbot_head+o:
        whitelist:
          tags:
          - BorgGenericHead
      junkbot_torso+o:
        whitelist:
          tags:
          - BorgGenericTorso
      mrhandy_body+o:
        minCount: 1
        whitelist:
          tags: [N14MrHandyBody]
      mrhandy_manipulator1+o:
        minCount: 1
        whitelist:
          tags: [N14MrHandyManipulator]
      mrhandy_manipulator2+o:
        minCount: 2
        whitelist:
          tags: [N14MrHandyManipulator]
      mrhandy_manipulator3+o:
        minCount: 3
        whitelist:
          tags: [N14MrHandyManipulator]
      mrhandy_thruster+o:
        minCount: 1
        whitelist:
          tags: [N14MrHandyThruster]
      eyebot_body+o:
        minCount: 1
        whitelist:
          tags: [N14EyebotBody]
      eyebot_antenna+o:
        minCount: 1
        whitelist:
          tags: [N14EyebotAntenna]
      eyebot_thruster+o:
        minCount: 1
        whitelist:
          tags: [N14EyebotThruster]
  - type: PartAssembly
    parts:
      generic: [BorgGenericLArm, BorgGenericRArm, BorgGenericLLeg, BorgGenericRLeg, BorgGenericHead, BorgGenericTorso]
      mrhandy: [N14MrHandyBody, N14MrHandyManipulator, N14MrHandyManipulator, N14MrHandyManipulator, N14MrHandyThruster]
      eyebot: [N14EyebotBody, N14EyebotAntenna, N14EyebotThruster]
  - type: Construction
    graph: N14JunktronCyborg
    node: start
    defaultTarget: cyborg
    containers:
    - part-container
    - cell_slot

# Упрощенный в плане стейтов спрайтов ММИ.
- type: entity
  id: N14JunktronMMI
  parent: MMI
  name: junk-machine interface
  description: A crude man-machine interface cobbled together from scrap. Lets a biological brain pilot a junkbot.
  components:
  - type: Sprite
    sprite: _Forge/Objects/Specific/Robotics/junktron_mmi.rsi
    layers:
    - state: inactive
      map: ["enum.MMIVisualLayers.Base"]
    - state: active
      map: ["enum.MMIVisualLayers.Brain"]
      visible: false
  - type: MMI
    noBrainState: inactive
    hasMindState: active
    noMindState: active
  - type: LanguageKnowledge
    speaks:
    - English
    - Chinese
    - Latin
    - RobotTalk
    understands:
    - English
    - Chinese
    - Latin
    - RobotTalk

# Кустарный позитронный мозг. Нужен, чтоб вставить свой красивый спрайт кустарного позитронного мозга.
- type: entity
  id: N14JunktronPositronicBrain
  parent: PositronicBrain
  name: junktron positronic brain
  description: A salvaged artificial brain assembled from scrap electronics. Surprisingly, it thinks.
  components:
  - type: LanguageKnowledge
    speaks:
    - English
    - Chinese
    - Latin
    - RobotTalk
    understands:
    - English
    - Chinese
    - Latin
    - RobotTalk
