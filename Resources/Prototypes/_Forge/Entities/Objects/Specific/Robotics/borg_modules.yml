# Модули боргов общей категории. (большая часть дублируют ваниллу, но был изобретен велосипед ради применения аутентичных*** спрайтов)
- type: entity
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  id: N14BorgModuleJunkTools
  components:
  - type: Sprite
    layers:
    - sprite: _Nuclear14/Objects/Specific/Robotics/borgmodule.rsi
      state: n14_generic
    - sprite: Objects/Specific/Robotics/borgmodule.rsi
      state: icon-tools
  - type: ItemBorgModule
    items:
    - Crowbar
    - Wrench
    - Screwdriver
    - Wirecutter
    - Multitool
    - WelderIndustrial

- type: entity
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  id: N14BorgModuleJunkGardening
