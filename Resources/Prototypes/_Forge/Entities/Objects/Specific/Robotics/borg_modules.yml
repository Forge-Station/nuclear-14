# модули хламобота (категория BorgModuleGeneric): рамка n14_generic из _Nuclear14-RSI + ванильные иконки.
- type: entity
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  id: N14BorgModuleJunkTools
  name: junk tool cyborg module
  components:
  - type: Sprite
    layers:
    - sprite: _Nuclear14/Objects/Specific/Robotics/borgmodule.rsi
      state: n14_generic
    - sprite: Objects/Specific/Robotics/borgmodule.rsi
      state: icon-tools
  - type: ItemBorgModule
    items:
    - Crowbar
    - Wrench
    - Screwdriver
    - Wirecutter
    - Multitool
    - WelderIndustrial

