# Здесь кастомный компонент для создания руки борга применяется. (добавляет N пустых рук напрямую боргу. Отбирает при выключении модуля. (на текущий момент люди (и не только) с одной рукой сталкиваются с багами, поэтому лучше пока 2, до лучших времен...)
- type: entity
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  id: N14BorgModuleJunkManipulator
  components:
  - type: Sprite
    layers:
    - sprite: _Nuclear14/Objects/Specific/Robotics/borgmodule.rsi
      state: n14_generic
    - sprite: Objects/Specific/Robotics/borgmodule.rsi
      state: icon-grappling-gun
  - type: BorgHandModule
    hands: 2

