  name: junk manipulator cyborg module
  components:
  - type: Sprite
    layers:
    - sprite: _Nuclear14/Objects/Specific/Robotics/borgmodule.rsi
      state: n14_generic
    - sprite: Objects/Specific/Robotics/borgmodule.rsi
      state: icon-grappling-gun
  - type: BorgHandModule
    hands: 1

