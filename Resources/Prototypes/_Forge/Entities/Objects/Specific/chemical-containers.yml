- type: entity
  parent: Jug
  id: N14JugBlood
  name: кувшин (крови)
  description: Используется для хранения очень большого количества химических веществ или растворов. Пить из него крайне не рекомендуется.
  categories: [ HideSpawnMenu ]
  components:
    - type: SolutionContainerManager
      solutions:
        beaker:
          reagents:
            - ReagentId: Blood
              Quantity: 200

