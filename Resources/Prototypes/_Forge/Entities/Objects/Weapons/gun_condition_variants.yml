# Forge: профили состояния оружия по классам.
# Использование: parent: [<БазовоеОружие>, <ForgeПрофиль>]

# ============================================
# Профили (абстрактные)
# ============================================

# Пистолеты / револьверы — надёжное короткоствольное оружие.
- type: entity
  id: ForgeGunConditionProfileSidearm
  abstract: true
  components:
  - type: GunCondition
    # Состояние
    maxCondition: 100       # максимум прочности
    condition: 100          # прочность при спавне
    brokenThreshold: 0      # при скольки ломается
    # Пороги износа (от лучшего к худшему)
    wornThreshold: 70       # потёртое
    damagedThreshold: 40    # повреждённое
    criticalThreshold: 15   # критическое
    # Износ и ремонт
    wearPerShot: 0.25       # потеря прочности за выстрел
    repairAmount: 28        # восстановление за ремонт
    unjamTime: 0.8          # время устранения клина (DoAfter), сек
    # Заклинивание
    jamStart: 55            # ниже — начинает клинить
    jamPeak: 12             # ниже — максимальный шанс клина
    jamChanceMin: 0         # шанс клина у начала зоны
    jamChanceMax: 0.14      # шанс клина в критической зоне
    jamCurve: 1.35          # кривая роста (1 = линейно, >1 = резче к концу)

