# Таблица выбора одной единицы руды. Веса относительные, а не процентные.
- type: entityTable
  id: N14ResourceExtractorOreTable
  table: !type:GroupSelector
    children:
    - !type:EntSelector
      id: N14IronOre1
      weight: 45
    - !type:EntSelector
      id: N14CopperOre1
      weight: 30
    - !type:EntSelector
      id: N14SilverOre1
      weight: 10
    - !type:EntSelector
      id: N14GoldOre1
      weight: 5
    - !type:EntSelector
      id: N14LeadOre1
      weight: 5
    - !type:EntSelector
      id: N14AluminumOre1
      weight: 5

- type: resourceExtractorProduction
  id: N14ResourceExtractorOreProduction
  outputTable: N14ResourceExtractorOreTable
  # За один цикл таблица руды прокручивается случайное целое число раз от 1 до 6.
  minOutputRolls: 1
  maxOutputRolls: 6
  # Максимальное количество СУЩНОСТЕЙ (не стаков) может получиться из одного ролла.
  # (Этот параметр существует, если вдруг вы решите в один вес впихнуть несколько сущностей).
  maxOutputEntities: 10
  events:
  # Шанс проверяется один раз за каждый завершённый и оплаченный топливный цикл.
  # Вместо кротокрыса можно и служебную сущность Взрыв-при-Спавне какую-нибудь поставить при желании.
  - entity: N14MobMolerat
    amount: 4
    chancePerRoll: 0.1
    telegraph: N14ResourceExtractorBurrowEffect
    telegraphDuration: 1.2
    spawnRadius: 3

