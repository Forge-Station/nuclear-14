- type: job
  id: Captain
  name: job-name-captain
  description: job-description-captain
  playTimeTracker: JobCaptain
  requirements:
    - !type:CharacterDepartmentTimeRequirement
      department: Engineering
      min: 4h
    - !type:CharacterDepartmentTimeRequirement
      department: Medical
      min: 4h
    - !type:CharacterDepartmentTimeRequirement
      department: Science
      min: 4h
    - !type:CharacterDepartmentTimeRequirement
      department: Security
      min: 4h
    - !type:CharacterDepartmentTimeRequirement
      department: Command
      min: 4h
  startingGear: CaptainGear
  icon: "JobIconCaptain"
  joinNotifyCrew: true
  supervisors: job-supervisors-centcom
  guides: [ Command ] # TODO: should have a more specific guidebook page instead of using the department itself
  accessGroups:
  - AllAccess
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff

- type: startingGear
  id: CaptainGear
  equipment:
    shoes: ClothingShoesBootsLaceup
    eyes: ClothingEyesGlassesCommand
    gloves: ClothingHandsGlovesCaptain
    id: CaptainPDA
    ears: ClothingHeadsetAltCommand
  storage:
    back:
    - Flash
    # - StationCharter

- type: chameleonOutfit
  id: CaptainChameleonOutfit
  job: Captain
  hasMindShield: true
  equipment:
    head: ClothingHeadHatCapcap
    eyes: ClothingEyesGlassesCommand
    mask: ClothingMaskGasCaptain
    neck: ClothingNeckCloakCap
