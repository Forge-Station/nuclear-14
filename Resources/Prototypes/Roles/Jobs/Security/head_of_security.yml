- type: job
  id: HeadOfSecurity
  name: job-name-hos
  description: job-description-hos
  playTimeTracker: JobHeadOfSecurity
  requirements:
    - !type:CharacterPlaytimeRequirement
      tracker: JobWarden
      min: 3h
    - !type:CharacterPlaytimeRequirement
      tracker: JobDetective
      min: 1h # knowing how to use the tools is important
    - !type:CharacterPlaytimeRequirement
      tracker: JobSecurityOfficer
      min: 5h
    - !type:CharacterDepartmentTimeRequirement
      department: Security
      min: 10h
  startingGear: HoSGear
  icon: "JobIconHeadOfSecurity"
  supervisors: job-supervisors-captain
  guides: [ Command ] # TODO: should have a more specific guidebook page instead of using the department itself
  access:
  - HeadOfSecurity
  - Command
  - Brig
  - Security
  - Armory
  - Maintenance
  - External
  - Detective
  - Cryogenics
  - GenpopEnter
  - GenpopLeave
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff

- type: startingGear
  id: HoSGear
  equipment:
    eyes: ClothingEyesGlassesSecurity
    id: HoSPDA
    gloves: ClothingHandsGlovesCombat
    ears: ClothingHeadsetAltSecurity
    pocket1: WeaponPistolMk58
  storage:
    back:
    - Flash
    - MagazinePistol

- type: chameleonOutfit
  id: HeadOfSecurityChameleonOutfit
  job: HeadOfSecurity
  hasMindShield: true
  equipment:
    head: ClothingHeadHatBeretHoS
    mask: ClothingMaskGasSecurity
    neck: ClothingNeckCloakHos
